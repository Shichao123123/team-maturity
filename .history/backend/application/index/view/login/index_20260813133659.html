<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>登录 - 中钢安环院 · 班组安全成熟度测评</title>
    <link rel="stylesheet" href="/component/pear/css/pear.css" />
    <link rel="stylesheet" href="/admin/css/other/login.css" />
</head>
<body class="login-page">
<div class="login-bg" aria-hidden="true">
    <img class="login-bg-img" src="/admin/images/brand/bg-page.jpg" alt="" />
    <div class="login-bg-mask"></div>
</div>

<div class="login-wrap">
    <div class="login-hero">
        <img class="login-hero-img" src="/admin/images/brand/bg-campus.jpg" alt="" />
        <div class="login-hero-mask"></div>
        <div class="login-hero-body">
            <img class="login-org-logo" src="/admin/images/brand/logo.png" alt="中钢安环院" />
            <div class="login-hero-title">班组安全成熟度测评</div>
            <div class="login-hero-sub">PC 管理端 · 组织 / 题库 / 批次 / 看板</div>
        </div>
    </div>

    <form class="layui-form login-card" action="/Login/login" method="post">
        {if condition="!empty($loginError)"}
        <div class="login-error">{$loginError}</div>
        {/if}
        <div class="layui-form-item">
            <input placeholder="账 户" class="layui-input" type="text" name="username" value="admin" lay-verify="required" autocomplete="username" />
        </div>
        <div class="layui-form-item">
            <input placeholder="密 码" class="layui-input" type="password" name="password" lay-verify="required" autocomplete="current-password" />        </div>
        <div class="layui-form-item">
            <button type="submit" class="login-btn" lay-submit>登 录</button>
        </div>
    </form>

    <div class="login-footer">
        <div class="copy">Copyright © 2026 中钢武汉安全环保研究院股份有限公司（中钢安环院） 版权所有</div>
        <div class="site">www.zgsepri.com · All Rights Reserved</div>
    </div>
</div>

<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    {include file="common/meta" /}
    {include file="common/css" /}
    <style>
        body { background: #f2f5fa; margin: 0; }
        .wb { padding: 16px; }
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 14px;
        }
        .kpi-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e8eef6;
            padding: 22px 20px 18px;
            box-shadow: 0 1px 2px rgba(15, 45, 90, .04);
        }
        .kpi-card .label { color: #5b6b7c; font-size: 14px; margin-bottom: 10px; }
        .kpi-card .value { color: #1677ff; font-size: 34px; font-weight: 700; line-height: 1.1; letter-spacing: .5px; }
        .kpi-card .value.muted { color: #94a3b8; font-size: 28px; font-weight: 600; }
        .main-row {
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 14px;
        }
        .panel {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e8eef6;
            box-shadow: 0 1px 2px rgba(15, 45, 90, .04);
            padding: 16px 18px 12px;
            min-height: 380px;
        }
        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2d3d;
            margin: 0 0 8px;
        }
        .panel-tip { color: #98a2b3; font-size: 12px; margin: 0 0 8px; }
        #levelChart { width: 100%; height: 320px; }
        .level-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .level-table th {
            background: #1677ff;
            color: #fff;
            font-weight: 600;
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
        }
        .level-table th:first-child { border-radius: 4px 0 0 0; }
        .level-table th:last-child { border-radius: 0 4px 0 0; }
        .level-table td {
            padding: 14px 10px;
            border-bottom: 1px solid #edf2f7;
            color: #334155;
            font-size: 13px;
        }
        .level-table tr:hover td { background: #f8fbff; }
        @media (max-width: 1100px) {
            .kpi-row { grid-template-columns: repeat(2, 1fr); }
            .main-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="wb">
    <div class="kpi-row">
        <div class="kpi-card">
            <div class="label">班组总数</div>
            <div class="value" id="kpiTeamTotal">-</div>
        </div>
        <div class="kpi-card">
            <div class="label">平均成熟得分</div>
            <div class="value" id="kpiAvgScore">-</div>
        </div>
        <div class="kpi-card">
            <div class="label">本质安全型班组</div>
            <div class="value" id="kpiEssential">-</div>
        </div>
        <div class="kpi-card">
            <div class="label">被动型班组</div>
            <div class="value" id="kpiPassive">-</div>
        </div>
    </div>

    <div class="main-row">
        <div class="panel">
            <div class="panel-title">成熟度等级分布</div>
            <p class="panel-tip" id="chartTip">数据来自最近一次有结果的测评批次；尚无结果时显示为空。</p>
            <div id="levelChart"></div>
        </div>
        <div class="panel">
            <div class="panel-title">等级明细清单</div>
            <p class="panel-tip">占比 = 该等级班组数 / 有结果班组数</p>
            <table class="level-table">
                <thead>
                <tr>
                    <th style="width:22%">等级</th>
                    <th style="width:16%">数量</th>
                    <th style="width:28%">占比</th>
                    <th>管理建议</th>
                </tr>
                </thead>
                <tbody id="levelTbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
<script>
layui.use(['jquery', 'echarts', 'layer'], function(){
    var $ = layui.jquery, echarts = layui.echarts, layer = layui.layer;
    var chart = echarts.init(document.getElementById('levelChart'));

    var colors = ['#0b3d91', '#1677ff', '#69b1ff', '#bae0ff'];

    function setKpi(id, val, emptyText){
        var el = document.getElementById(id);
        if (val === null || val === undefined || val === '') {
            el.textContent = emptyText || '—';
            el.classList.add('muted');
        } else {
            el.textContent = val;
            el.classList.remove('muted');
        }
    }

    function renderChart(items, total){
        if (!total) {
            chart.clear();
            chart.setOption({
                title: {
                    text: '暂无测评结果',
                    left: 'center',
                    top: 'center',
                    textStyle: { color: '#94a3b8', fontSize: 16, fontWeight: 400 }
                }
            });
            return;
        }
        var data = items.map(function(it, i){
            return {
                name: it.level_name,
                value: it.count,
                itemStyle: { color: colors[i % colors.length] }
            };
        });
        chart.setOption({
            tooltip: { trigger: 'item', formatter: '{b}<br/>{c}（{d}%）' },
            legend: { show: false },
            series: [{
                type: 'pie',
                radius: ['48%', '72%'],
                center: ['50%', '52%'],
                avoidLabelOverlap: true,
                label: {
                    formatter: '{b}\n{d}%',
                    color: '#475569',
                    fontSize: 12,
                    lineHeight: 18
                },
                labelLine: { length: 14, length2: 12 },
                data: data
            }]
        });
    }

    function renderTable(items){
        var html = '';
        (items || []).forEach(function(it){
            html += '<tr>'
                + '<td>'+ it.level_name +'</td>'
                + '<td>'+ it.count +'</td>'
                + '<td>'+ it.count +' | '+ it.percent_text +'</td>'
                + '<td>'+ (it.advice || '') +'</td>'
                + '</tr>';
        });
        $('#levelTbody').html(html || '<tr><td colspan="4" style="color:#94a3b8;">暂无数据</td></tr>');
    }

    function load(){
        $.getJSON('/Index/workbenchStats', function(res){
            if (!(res.success || res.code === 0)) {
                layer.msg(res.msg || '加载失败');
                return;
            }
            var d = res.data || {};
            setKpi('kpiTeamTotal', d.team_total, '0');
            setKpi('kpiAvgScore', d.avg_score_text, '—');
            setKpi('kpiEssential', d.essential_cnt, '0');
            setKpi('kpiPassive', d.passive_cnt, '0');
            if (d.batch_name) {
                $('#chartTip').text('当前统计批次：' + d.batch_name + (d.scored_at ? (' · ' + d.scored_at) : ''));
            }
            renderChart(d.levels || [], d.result_team_cnt || 0);
            renderTable(d.levels || []);
        });
    }

    load();
    window.addEventListener('resize', function(){ chart.resize(); });
});
</script>
</body>
</html>

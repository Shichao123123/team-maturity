<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>登录 - 班组安全成熟度测评系统</title>
    <link rel="stylesheet" href="/component/pear/css/pear.css" />
    <link rel="stylesheet" href="/admin/css/other/login.css" />
    <style>
        html, body { width: 100%; min-height: 100%; margin: 0; }
        .login-bg {
            background: linear-gradient(135deg, #0f3d2e 0%, #1a6b4a 45%, #2d8f66 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 380px;
            background: rgba(255,255,255,.96);
            border-radius: 8px;
            padding: 36px 32px 28px;
            box-shadow: 0 12px 40px rgba(0,0,0,.18);
        }
        .login-card .title { font-size: 22px; font-weight: 600; color: #1a3c2e; text-align: center; }
        .login-card .desc { margin: 8px 0 28px; text-align: center; color: #6b7c72; font-size: 13px; }
        .login-card .logo { display: block; width: 56px; height: 56px; margin: 0 auto 12px; }
        .pear-btn.login { width: 100%; height: 42px; }
    </style>
</head>
<body class="login-bg">
<form class="layui-form login-card" action="/Login/login" method="post">
    <img class="logo" src="/admin/images/logo.png" alt="logo" onerror="this.style.display='none'" />
    <div class="title">班组安全成熟度</div>
    <div class="desc">测评管理系统 · PC 管理端</div>
    <div class="layui-form-item">
        <input placeholder="账 户" class="layui-input" type="text" name="username" value="admin" lay-verify="required" />
    </div>
    <div class="layui-form-item">
        <input placeholder="密 码" class="layui-input" type="password" name="password" value="123456" lay-verify="required" />
    </div>
    <div class="layui-form-item">
        <button type="submit" class="pear-btn pear-btn-success login" lay-submit>登 录</button>
    </div>
</form>
<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
</body>
</html>

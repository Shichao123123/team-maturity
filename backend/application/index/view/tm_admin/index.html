<!DOCTYPE html>
<html>
<head>
    {include file="common/meta" /}
    {include file="common/css" /}
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" lay-filter="filterForm" onsubmit="return false;">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <select name="roleId" lay-filter="autoFilter">
                        <option value="">全部角色</option>
                        {volist name="roles" id="r"}
                        <option value="{$r.id}">{$r.name}</option>
                        {/volist}
                    </select>
                </div>
                <div class="layui-inline">
                    <select name="status" lay-filter="autoFilter">
                        <option value="">全部状态</option>
                        <option value="1">启用</option>
                        <option value="0">停用</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" name="keyword" placeholder="姓名/账号/手机号" class="layui-input">
                </div>
                <div class="layui-inline">
                    <button type="button" class="pear-btn pear-btn-md pear-btn-success" id="btnAdd">新增管理员</button>
                </div>
            </div>
        </form>
        <table id="dataTable" lay-filter="dataTable"></table>
    </div>
</div>

<script type="text/html" id="bar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="pwd">重置密码</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script type="text/html" id="editTpl">
    <form class="layui-form" style="padding:20px 24px 10px;" lay-filter="editForm">
        <input type="hidden" name="id">
        <div class="layui-form-item">
            <label class="layui-form-label">姓名</label>
            <div class="layui-input-block">
                <input type="text" name="name" required lay-verify="required" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">登录账号</label>
            <div class="layui-input-block">
                <input type="text" name="username" required lay-verify="required" class="layui-input" placeholder="字母数字下划线">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input type="text" name="mobile" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">角色</label>
            <div class="layui-input-block">
                <select name="role_id" lay-verify="required">
                    <option value="">请选择</option>
                    {volist name="roles" id="r"}
                    <option value="{$r.id}">{$r.name}</option>
                    {/volist}
                </select>
            </div>
        </div>
        <div class="layui-form-item" id="pwdItem">
            <label class="layui-form-label">密码</label>
            <div class="layui-input-block">
                <input type="password" name="password" class="layui-input" placeholder="新增必填；编辑留空则不改">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <select name="status">
                    <option value="1">启用</option>
                    <option value="0">停用</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="pear-btn pear-btn-primary" lay-submit lay-filter="save">保存</button>
            </div>
        </div>
    </form>
</script>

<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
<script>
layui.use(['table','form','jquery','layer'], function(){
    var table = layui.table, form = layui.form, $ = layui.jquery, layer = layui.layer;

    function reloadFilter(){
        table.reload('dataTable', {where: form.val('filterForm') || {}, page:{curr:1}});
    }
    form.on('select(autoFilter)', function(){ reloadFilter(); });
    var keywordTimer = null;
    $('form[lay-filter="filterForm"] input[name="keyword"]').on('input', function(){
        clearTimeout(keywordTimer);
        keywordTimer = setTimeout(reloadFilter, 300);
    });

    table.render({
        elem: '#dataTable',
        id: 'dataTable',
        url: '/TmAdmin/getList',
        page: true,
        cols: [[
            {field:'name', title:'姓名', width:110},
            {field:'username', title:'登录账号', width:120},
            {field:'mobile', title:'手机号', width:130, templet: function(d){ return d.mobile || ''; }},
            {field:'role_name', title:'角色', width:120},
            {field:'status', title:'状态', width:80, templet: function(d){ return d.status==1?'启用':'停用'; }},
            {field:'last_login_at', title:'最后登录', width:170, templet: function(d){ return d.last_login_at || ''; }},
            {field:'login_count', title:'登录次数', width:90},
            {field:'created_at', title:'创建时间', width:170},
            {title:'操作', toolbar:'#bar', width:220, fixed:'right'}
        ]]
    });

    function openForm(row){
        layer.open({
            type: 1,
            title: row && row.id ? '编辑管理员' : '新增管理员',
            area: ['520px', '560px'],
            content: $('#editTpl').html(),
            success: function(){
                form.render(null, 'editForm');
                if (row) {
                    form.val('editForm', {
                        id: row.id,
                        name: row.name,
                        username: row.username,
                        mobile: row.mobile || '',
                        role_id: row.role_id,
                        status: row.status,
                        password: ''
                    });
                }
                form.on('submit(save)', function(d){
                    $.post('/TmAdmin/save', d.field, function(res){
                        layer.msg(res.msg || '');
                        if (res.success || res.code===0) {
                            layer.closeAll();
                            table.reload('dataTable');
                        }
                    }, 'json');
                    return false;
                });
            }
        });
    }

    $('#btnAdd').on('click', function(){ openForm(null); });

    table.on('tool(dataTable)', function(obj){
        if (obj.event === 'edit') openForm(obj.data);
        if (obj.event === 'del') {
            layer.confirm('确认删除该管理员？', function(i){
                $.post('/TmAdmin/delete', {id: obj.data.id}, function(res){
                    layer.msg(res.msg || '');
                    if (res.success || res.code===0) table.reload('dataTable');
                }, 'json');
                layer.close(i);
            });
        }
        if (obj.event === 'pwd') {
            layer.prompt({title: '重置密码（至少6位）', formType: 1}, function(val, idx){
                $.post('/TmAdmin/resetPassword', {id: obj.data.id, password: val}, function(res){
                    layer.msg(res.msg || '');
                    if (res.success || res.code===0) layer.close(idx);
                }, 'json');
            });
        }
    });
});
</script>
</body>
</html>

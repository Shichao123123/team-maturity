<!DOCTYPE html>
<html>
<head>
    {include file="common/meta" /}
    {include file="common/css" /}
    <style>
        .tip { color:#64748b; font-size:12px; line-height:1.6; margin:0 0 10px; }
        .entry-box {
            background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;
            padding:10px 12px; margin:10px 0 14px; font-size:13px; color:#334155;
        }
        .entry-box code { background:#e2e8f0; padding:1px 6px; border-radius:4px; }
        .team-check-box {
            max-height:280px; overflow:auto; border:1px solid #e2e8f0; border-radius:6px;
            padding:8px 12px; background:#fff;
        }
        .team-check-box .layui-form-item { margin-bottom:6px; }
        .team-busy { color:#b91c1c; font-size:12px; margin-left:6px; }
        .team-check-toolbar { margin-bottom:8px; }
        .status-tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:12px; }
        .st-0 { background:#f1f5f9; color:#475569; }
        .st-1 { background:#dcfce7; color:#166534; }
        .st-2 { background:#fee2e2; color:#991b1b; }
        .act-row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 12px; }
        .batch-detail-scroll { max-height: calc(100vh - 160px); overflow:auto; padding-right:4px; }
    </style>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" lay-filter="filterForm" onsubmit="return false;">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <select name="status" lay-filter="autoFilter">
                        <option value="">全部状态</option>
                        <option value="0">未开始</option>
                        <option value="1">进行中</option>
                        <option value="2">已结束</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" name="keyword" placeholder="批次名称（输入即筛选）" class="layui-input" style="width:220px;">
                </div>
                <div class="layui-inline">
                    <button type="button" class="pear-btn pear-btn-md pear-btn-primary" id="btnAdd">创建批次</button>
                </div>
            </div>
        </form>
        <table id="dataTable" lay-filter="dataTable"></table>
    </div>
</div>

<script type="text/html" id="bar">
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="detail">详情</a>
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script type="text/html" id="editTpl">
    <form class="layui-form" style="padding:20px 24px 10px;" lay-filter="editForm">
        <input type="hidden" name="id">
        <p class="tip" id="createNextTip" style="display:none;margin:0 0 12px 0;">填写名称、版本与时间后保存，将自动进入「选择参评班组 / 开测」。</p>
        <div class="layui-form-item">
            <label class="layui-form-label">批次名称</label>
            <div class="layui-input-block">
                <input type="text" name="name" required lay-verify="required" class="layui-input" placeholder="如：2026年一季度班组测评">
            </div>
        </div>
        <div class="layui-form-item" id="versionItem">
            <label class="layui-form-label">指标版本</label>
            <div class="layui-input-block">
                <select name="version_id" lay-verify="required" lay-search>
                    <option value="">请选择已发布版本</option>
                    {volist name="versions" id="v"}
                    <option value="{$v.id}">{$v.name}（{$v.version_no}）</option>
                    {/volist}
                </select>
            </div>
        </div>
        <div class="layui-form-item" id="startItem">
            <label class="layui-form-label">开始时间</label>
            <div class="layui-input-block">
                <input type="text" name="start_time" id="startTime" required lay-verify="required" class="layui-input" autocomplete="off">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">结束时间</label>
            <div class="layui-input-block">
                <input type="text" name="end_time" id="endTime" required lay-verify="required" class="layui-input" autocomplete="off">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="pear-btn pear-btn-primary" lay-submit lay-filter="save" id="btnSaveBatch">保存</button>
            </div>
        </div>
    </form>
</script>

<script type="text/html" id="detailTpl">
    <div style="padding:14px 18px 18px;" id="detailBody" class="batch-detail-scroll">
        <div class="tip" id="detailMeta"></div>
        <div class="entry-box" id="detailEntry"></div>
        <div class="act-row" id="detailActions"></div>
        <div id="bindBlock">
            <div class="tip">参评班组（开测前可修改；开测后锁定）。同一班组在重叠时间段内若已有测评任务则不可选。</div>
            <form class="layui-form" lay-filter="bindForm">
                <div class="team-check-toolbar" id="selectAllWrap">
                    <input type="checkbox" name="select_all" id="selectAllTeams" title="全选可选班组" lay-skin="primary" lay-filter="selectAllTeams">
                </div>
                <div class="team-check-box">
                    {volist name="teams" id="t"}
                    <div class="layui-form-item team-row" style="margin-bottom:4px;" data-team-id="{$t.id}">
                        <input type="checkbox" name="team_ids" value="{$t.id}" title="{$t.name}（{$t.org_path}）" lay-skin="primary" lay-filter="teamPick">
                        <span class="team-busy" style="display:none;"></span>
                    </div>
                    {/volist}
                </div>
                <div style="margin-top:10px;" id="bindSaveWrap">
                    <button type="button" class="pear-btn pear-btn-md pear-btn-primary" id="btnBindTeams">保存班组绑定</button>
                </div>
            </form>
        </div>
        <div style="margin-top:16px;">
            <div class="tip">班组进度</div>
            <table id="progressTable" lay-filter="progressTable"></table>
        </div>
    </div>
</script>

<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
<script>
layui.use(['table','form','jquery','layer','laydate'], function(){
    var table = layui.table, form = layui.form, $ = layui.jquery, layer = layui.layer, laydate = layui.laydate;
    form.render();

    function reloadFilter(){
        table.reload('dataTable', {where: form.val('filterForm') || {}, page:{curr:1}});
    }
    form.on('select(autoFilter)', function(){ reloadFilter(); });
    form.on('checkbox(selectAllTeams)', function(data){
        var checked = data.elem.checked;
        $('form[lay-filter="bindForm"] input[name="team_ids"]').each(function(){
            if ($(this).attr('disabled')) return;
            $(this).prop('checked', checked);
        });
        form.render('checkbox', 'bindForm');
        $('#selectAllTeams').prop('checked', checked);
        form.render('checkbox', 'bindForm');
    });
    form.on('checkbox(teamPick)', function(){
        var $all = $('form[lay-filter="bindForm"] input[name="team_ids"]').filter(function(){
            return !$(this).attr('disabled');
        });
        var $checked = $all.filter(':checked');
        $('#selectAllTeams').prop('checked', $all.length > 0 && $all.length === $checked.length);
        form.render('checkbox', 'bindForm');
    });
    var keywordTimer = null;
    $('form[lay-filter="filterForm"] input[name="keyword"]').on('input', function(){
        clearTimeout(keywordTimer);
        keywordTimer = setTimeout(reloadFilter, 300);
    });

    function statusHtml(d){
        var s = parseInt(d.status, 10);
        var cls = 'st-' + (s === 1 || s === 2 ? s : 0);
        return '<span class="status-tag '+cls+'">'+(d.status_text||'')+'</span>';
    }

    table.render({
        elem: '#dataTable',
        id: 'dataTable',
        url: '/TmBatch/getList',
        page: true,
        cols: [[
            {field:'name', title:'批次名称', minWidth:180},
            {field:'version_name', title:'指标版本', width:140, templet: function(d){
                return (d.version_name||'') + (d.version_no ? '（'+d.version_no+'）' : '');
            }},
            {field:'start_time', title:'开始', width:160},
            {field:'end_time', title:'结束', width:160},
            {field:'status', title:'状态', width:90, templet: statusHtml},
            {field:'score_status_text', title:'算分', width:90},
            {field:'team_cnt', title:'班组', width:70, align:'center'},
            {field:'submitted_cnt', title:'已提交', width:80, align:'center'},
            {title:'操作', toolbar:'#bar', width:180, fixed:'right'}
        ]]
    });

    function openForm(row){
        var started = row && parseInt(row.status, 10) !== 0;
        layer.open({
            type:1,
            title: row && row.id ? '编辑批次' : '创建批次',
            closeBtn: 1,
            offset: '30px',
            area:['640px','520px'],
            content: $('#editTpl').html(),
            success: function(){
                form.render(null, 'editForm');
                laydate.render({elem: '#startTime', type: 'datetime'});
                laydate.render({elem: '#endTime', type: 'datetime'});
                if (row) {
                    $('#createNextTip').hide();
                    form.val('editForm', row);
                    if (started) {
                        $('#versionItem').hide();
                        $('#startItem').hide();
                    }
                } else {
                    $('#createNextTip').show();
                    $('#btnSaveBatch').text('下一步：选择班组');
                }
                form.on('submit(save)', function(d){
                    var isCreate = !d.field.id;
                    var url = isCreate ? '/TmBatch/add' : '/TmBatch/edit';
                    var loadIdx = layer.load(2);
                    $.post(url, d.field, function(res){
                        layer.close(loadIdx);
                        layer.msg(res.msg||'');
                        if (res.success || res.code===0){
                            layer.closeAll('page');
                            table.reload('dataTable');
                            // 新建成功后直接进入选班组 / 开测，无需再点详情
                            if (isCreate && res.data && res.data.id) {
                                setTimeout(function(){ openDetail(res.data.id); }, 200);
                            }
                        }
                    }, 'json');
                    return false;
                });
            }
        });
    }

    function openDetail(batchId){
        var load = layer.load(2);
        $.getJSON('/TmBatch/detail', {id: batchId}, function(res){
            layer.close(load);
            if (!(res.success || res.code===0) || !res.data) {
                layer.msg(res.msg || '加载失败');
                return;
            }
            var d = res.data;
            layer.open({
                type: 1,
                title: '批次详情 — ' + (d.name || ''),
                closeBtn: 1,
                maxmin: true,
                shadeClose: true,
                // 贴顶大窗，避免垂直居中裁切关闭按钮，同时占满可用区域
                offset: '10px',
                area: ['96%', '90%'],
                content: $('#detailTpl').html(),
                btn: ['关闭'],
                yes: function(index){ layer.close(index); },
                success: function(layero){
                    form.render(null, 'bindForm');
                    renderDetail(d);
                    // 内容区随弹层高度撑满，进度表更易浏览
                    var h = layero.height() - 120;
                    layero.find('.batch-detail-scroll').css('max-height', Math.max(360, h) + 'px');
                }
            });
        }).fail(function(){
            layer.close(load);
            layer.msg('加载失败');
        });
    }

    function renderDetail(d){
        var status = parseInt(d.status, 10);
        $('#detailMeta').html(
            statusHtml(d) + ' · 版本 ' + (d.version_name||'') +
            (d.version_no ? '（'+d.version_no+'）' : '') +
            ' · ' + (d.start_time||'') + ' ~ ' + (d.end_time||'') +
            ' · 算分状态：' + (d.score_status_text||'') +
            (d.has_snap ? (' · 快照题数 ' + (d.question_cnt||0)) : ' · 尚未写快照')
        );
        $('#detailEntry').html(
            '小程序扫码入口参数：<code>batch_id=' + d.id + '</code>' +
            '（本期不生成微信码；开测后用户扫码选班组填姓名即可登记）'
        );

        var actions = '';
        if (status === 0) {
            actions += '<button type="button" class="pear-btn pear-btn-md pear-btn-success" id="btnStart">开测（抽题写快照）</button>';
        }
        if (status === 1) {
            actions += '<button type="button" class="pear-btn pear-btn-md pear-btn-warm" id="btnFinish">结束批次</button>';
            actions += '<button type="button" class="pear-btn pear-btn-md pear-btn-primary" id="btnScore">班组算分</button>';
        }
        if (status === 2) {
            actions += '<button type="button" class="pear-btn pear-btn-md pear-btn-primary" id="btnScore">重新算分</button>';
        }
        $('#detailActions').html(actions);

        var idSet = {};
        (d.team_ids || []).forEach(function(x){ idSet[String(x)] = true; });
        var busyMap = d.busy_teams || {};
        $('form[lay-filter="bindForm"] .team-row').each(function(){
            var $row = $(this);
            var tid = String($row.data('team-id'));
            var $cb = $row.find('input[name="team_ids"]');
            var $busy = $row.find('.team-busy');
            var busy = busyMap[tid] || busyMap[parseInt(tid, 10)];
            $cb.prop('checked', !!idSet[tid]);
            if (busy) {
                $cb.prop('checked', false);
                $cb.attr('disabled', true);
                $busy.text('不可选：已在「' + (busy.batch_name || '') + '」（' + (busy.status_text || '') + '）').show();
            } else {
                $cb.attr('disabled', status !== 0);
                $busy.hide().text('');
            }
        });
        $('#selectAllTeams').prop('checked', false).attr('disabled', status !== 0);
        form.render('checkbox', 'bindForm');
        if (status !== 0) {
            $('#bindSaveWrap').hide();
            $('#selectAllWrap').hide();
        } else {
            $('#bindSaveWrap').show();
            $('#selectAllWrap').show();
            // 同步全选框状态
            var $avail = $('form[lay-filter="bindForm"] input[name="team_ids"]').filter(function(){
                return !$(this).attr('disabled');
            });
            $('#selectAllTeams').prop('checked', $avail.length > 0 && $avail.length === $avail.filter(':checked').length);
            form.render('checkbox', 'bindForm');
        }

        table.render({
            elem: '#progressTable',
            id: 'progressTable',
            data: d.progress || [],
            page: false,
            limit: 200,
            cols: [[
                {field:'team_name', title:'班组', minWidth:120},
                {field:'member_total', title:'绑定时人数', width:100, align:'center'},
                {field:'submitted_cnt', title:'已提交', width:80, align:'center'},
                {field:'answering_cnt', title:'答题中', width:80, align:'center'},
                {field:'team_score', title:'班组分', width:90, templet: function(r){
                    return (r.team_score===null||r.team_score===undefined||r.team_score==='') ? '—' : Number(r.team_score).toFixed(1);
                }},
                {field:'level_name', title:'等级', width:100, templet: function(r){ return r.level_name || '—'; }},
                {field:'last_submitted_at', title:'最近提交', width:160, templet: function(r){ return r.last_submitted_at || '—'; }}
            ]]
        });

        $('#btnBindTeams').off('click').on('click', function(){
            var teamIds = [];
            $('form[lay-filter="bindForm"] input[name="team_ids"]:checked').each(function(){
                if ($(this).attr('disabled')) return;
                teamIds.push($(this).val());
            });
            $.post('/TmBatch/bindTeams', {batch_id: d.id, team_ids: teamIds}, function(res){
                layer.msg(res.msg||'');
                if (res.success || res.code===0) refreshDetail(d.id);
            }, 'json');
        });
        $('#btnStart').off('click').on('click', function(){
            layer.confirm('确认开测？将按指标版本抽题写入快照，开测后不可改版本与班组。', function(i){
                layer.close(i);
                var l = layer.load(2);
                $.post('/TmBatch/start', {id: d.id}, function(res){
                    layer.close(l);
                    layer.msg(res.msg||'');
                    if (res.success || res.code===0) {
                        refreshDetail(d.id);
                        table.reload('dataTable');
                    }
                }, 'json');
            });
        });
        $('#btnFinish').off('click').on('click', function(){
            layer.confirm('确认结束本批次？结束后小程序不可再登记作答。', function(i){
                layer.close(i);
                $.post('/TmBatch/finish', {id: d.id}, function(res){
                    layer.msg(res.msg||'');
                    if (res.success || res.code===0) {
                        refreshDetail(d.id);
                        table.reload('dataTable');
                    }
                }, 'json');
            });
        });
        $('#btnScore').off('click').on('click', function(){
            var l = layer.load(2);
            $.post('/TmBatch/score', {id: d.id}, function(res){
                layer.close(l);
                layer.msg(res.msg||'');
                if (res.success || res.code===0) {
                    refreshDetail(d.id);
                    table.reload('dataTable');
                }
            }, 'json');
        });
    }

    function refreshDetail(batchId){
        $.getJSON('/TmBatch/detail', {id: batchId}, function(res){
            if ((res.success || res.code===0) && res.data) {
                renderDetail(res.data);
            }
        });
    }

    $('#btnAdd').on('click', function(){ openForm(null); });

    table.on('tool(dataTable)', function(obj){
        if (obj.event === 'detail') openDetail(obj.data.id);
        if (obj.event === 'edit') openForm(obj.data);
        if (obj.event === 'del') {
            layer.confirm('确认删除该批次？', function(i){
                $.post('/TmBatch/delete', {id: obj.data.id}, function(res){
                    layer.msg(res.msg||'');
                    if (res.success || res.code===0) table.reload('dataTable');
                }, 'json');
                layer.close(i);
            });
        }
    });
});
</script>
</body>
</html>

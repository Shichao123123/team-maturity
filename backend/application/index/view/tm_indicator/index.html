<!DOCTYPE html>
<html>
<head>
    {include file="common/meta" /}
    {include file="common/css" /}
    <style>
        body.pear-container { background:#f2f5fa !important; min-height:100vh; padding:16px !important; }
        .toolbar {
            background:#fff; border-radius:8px; padding:12px 16px; margin-bottom:14px;
            border:1px solid #e8eef6; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
        }
        .wrap { display:flex; gap:14px; align-items:flex-start; }
        .left, .right {
            background:#fff; border-radius:8px; padding:14px 16px; border:1px solid #e8eef6;
        }
        .left {
            width:380px; flex:0 0 380px; position:sticky; top:12px;
            max-height:calc(100vh - 24px); display:flex; flex-direction:column;
        }
        .right { flex:1; min-width:0; min-height:70vh; }
        .left-hd, .right-hd {
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #edf2f7;
        }
        .tit { font-weight:600; font-size:15px; color:#1f2d3d; }
        .ops .pear-btn { margin-left:4px; }
        #treeBox { flex:1; min-height:0; overflow:auto; }
        .layui-tree-set.tm-active > .layui-tree-entry {
            background:#e6f4ff; box-shadow:inset 3px 0 0 #1677ff;
        }
        .q-item {
            border:1px solid #e8eef6; background:#fff; border-radius:8px;
            padding:14px 16px; margin-bottom:12px;
        }
        .q-title { font-weight:600; color:#1f2d3d; margin-bottom:8px; line-height:1.55; display:flex; gap:10px; }
        .q-no {
            flex:0 0 auto; min-width:28px; height:28px; line-height:28px; text-align:center;
            border-radius:6px; color:#fff; font-size:13px; background:#1677ff;
        }
        .q-indicator { font-weight:600; color:#0f766e; margin-bottom:8px; }
        .opt { margin:6px 0; padding:8px 12px; border-radius:6px; background:#f8fafc; color:#334155; display:flex; align-items:center; gap:10px; }
        .opt .opt-text { flex:1; min-width:0; }
        .opt .opt-w { color:#64748b; font-size:12px; white-space:nowrap; }
        .opt .opt-weight-input { width:72px; height:28px; line-height:28px; padding:0 6px; border:1px solid #d0d7de; border-radius:4px; }
        .q-actions { margin-top:10px; }
        .empty-tip { color:#64748b; padding:24px 8px; }
        .readonly-tip { color:#d48806; font-size:12px; }
        .ind-card {
            border:1px solid #e8eef6; border-radius:8px; padding:14px 16px; margin-bottom:14px; background:#fafcff;
        }
        .ind-card .ind-level {
            display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px;
            background:#e6f4ff; color:#1677ff; margin-bottom:10px;
        }
        .ind-card .layui-form-label { width:70px; }
        .ind-card .layui-input-block { margin-left:100px; }
        .opt-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
        .opt-row .layui-input { flex:1; }
        .opt-row .ratio { width:88px; flex:0 0 88px; }
        .opt-head { display:flex; gap:8px; margin-bottom:6px; color:#94a3b8; font-size:12px; }
        .opt-head .h-content { flex:1; }
        .opt-head .h-ratio { width:88px; flex:0 0 88px; text-align:center; }
        .opt-head .h-act { width:40px; flex:0 0 40px; }
    </style>
</head>
<body class="pear-container">
<div class="toolbar layui-form">
    <button type="button" class="pear-btn pear-btn-md" id="btnBackVersion" title="返回指标版本列表">返回指标列表</button>
    <div class="layui-inline">
        <select id="versionId" lay-filter="versionId">
            {volist name="versions" id="v"}
            <option value="{$v.id}" {if condition="$v.id == $defaultVersionId"}selected{/if}>
                {$v.name}（{$v.version_no}）
                {if condition="$v.status == 0"}·草稿{elseif condition="$v.status == 1"}·已发布{else /}·停用{/if}
            </option>
            {/volist}
        </select>
    </div>
    <span id="editState" class="readonly-tip"></span>
</div>
<div class="wrap">
    <div class="left">
        <div class="left-hd">
            <div class="tit">指标树</div>
            <div class="ops">
                <span class="readonly-tip" style="font-size:12px;">结构固定，点节点可改名称与分数</span>
            </div>
        </div>
        <div id="treeBox"></div>
    </div>
    <div class="right">
        <div id="indCard" class="ind-card" style="display:none;">
            <div class="ind-level" id="indLevelText">编辑指标</div>
            <form class="layui-form" lay-filter="indForm" id="indForm">
                <input type="hidden" name="id" id="indId">
                <div class="layui-form-item">
                    <label class="layui-form-label">名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="name" id="indName" class="layui-input" maxlength="128" autocomplete="off">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">分数</label>
                    <div class="layui-input-block">
                        <input type="number" name="weight" id="indWeight" class="layui-input" min="0" max="100" step="0.01" style="width:140px; display:inline-block;">
                        <span class="layui-word-aux" id="indWeightTip" style="margin-left:8px;">对应树上的 [分数]</span>
                    </div>
                </div>
                <div class="layui-form-item edit-only">
                    <div class="layui-input-block">
                        <button type="button" class="pear-btn pear-btn-primary pear-btn-md" id="btnSaveInd">保存</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="right-hd">
            <div class="tit">题目列表 <span id="qCount" style="color:#1677ff;">0</span></div>
            <div class="ops">
                <button type="button" class="pear-btn pear-btn-xs pear-btn-primary edit-only" id="btnAddQ">新增题目</button>
            </div>
        </div>
        <div id="qBox" class="empty-tip">请选择左侧指标或版本</div>
    </div>
</div>

<script type="text/html" id="qTpl">
    <form class="layui-form" style="padding:16px 20px;" lay-filter="qForm">
        <input type="hidden" name="id">
        <input type="hidden" name="indicator_id" id="qIndicatorId">
        <div class="layui-form-item">
            <label class="layui-form-label">一级指标</label>
            <div class="layui-input-block">
                <select id="selL1" lay-filter="selL1" lay-verify="required">
                    <option value="">请选择一级指标</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">二级指标</label>
            <div class="layui-input-block">
                <select id="selL2" lay-filter="selL2" lay-verify="required">
                    <option value="">请先选一级</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">三级指标</label>
            <div class="layui-input-block">
                <select id="selL3" lay-filter="selL3" lay-verify="required">
                    <option value="">请先选二级</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">题干</label>
            <div class="layui-input-block">
                <textarea name="title" required lay-verify="required" class="layui-textarea" style="min-height:80px;"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">选项</label>
            <div class="layui-input-block" id="optBox"></div>
            <div class="layui-input-block" style="margin-top:6px;">
                <button type="button" class="pear-btn pear-btn-xs" id="btnAddOpt">加选项</button>
                <span class="layui-word-aux">选项得分比例常用 1 / 0.75 / 0.5 / 0.25（得分 = 三级指标权重 × 得分比例）</span>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">排序</label>
            <div class="layui-input-block">
                <input type="number" name="sort_no" value="0" class="layui-input" style="width:120px;">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button type="submit" class="pear-btn pear-btn-primary" lay-submit lay-filter="saveQ">保存</button>
                <button type="button" class="pear-btn" id="btnCancelQ">关闭</button>
            </div>
        </div>
    </form>
</script>

<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
<script>
layui.use(['form','jquery','layer','tree'], function(){
    var form = layui.form, $ = layui.jquery, layer = layui.layer, tree = layui.tree;
    var currentIndicatorId = 0;
    var currentNode = null;
    var treeData = [];
    var canEdit = false;
    var nodeMap = {};

    function levelLabel(lv){
        lv = parseInt(lv, 10) || 0;
        if (lv === 1) return '一级指标';
        if (lv === 2) return '二级指标';
        if (lv === 3) return '三级指标';
        return '指标';
    }

    function fillIndicatorForm(node){
        if (!node || !node.id) {
            $('#indCard').hide();
            return;
        }
        var lv = parseInt(node.level_no, 10) || 0;
        var scoreTotal = node.score_total != null ? parseFloat(node.score_total) : null;
        var weight = node.weight != null ? parseFloat(node.weight) : 0;
        // 一/二级树上 [分数] 用的是下级满分合计；二级库里 weight 常为 0
        var showScore = (lv === 2 && scoreTotal != null) ? scoreTotal : weight;
        var weightEditable = canEdit && lv !== 2;

        $('#indCard').show();
        $('#indLevelText').text(levelLabel(lv));
        $('#indId').val(node.id);
        $('#indName').val(node.name || '').prop('disabled', !canEdit);
        $('#indWeight').val(showScore);
        $('#indWeight').prop('disabled', !weightEditable);
        if (lv === 2) {
            $('#indWeightTip').text('二级分数=下级三级合计（只读），请点开三级指标改分');
        } else if (lv === 1) {
            $('#indWeightTip').text('对应树上的 [分数]；发布时需与下级三级合计一致');
        } else {
            $('#indWeightTip').text('对应树上的 [分数]，用于计分');
        }
        $('#btnSaveInd').toggle(!!canEdit);
    }

    function setEditMode(flag){
        canEdit = !!flag;
        $('.edit-only').toggle(canEdit);
        $('#editState').text(canEdit
            ? '当前为草稿：可改名称；一/三级可改分数；二级分数看下级三级'
            : '已发布/停用只读；请到「指标版本」复制为草稿后再改');
        if (currentNode) {
            fillIndicatorForm(currentNode);
        }
    }

    function walk(nodes, fn){
        (nodes||[]).forEach(function(n){
            fn(n);
            if (n.children) walk(n.children, fn);
        });
    }

    function toTreeData(nodes, mode, depth){
        depth = depth || 0;
        return (nodes || []).map(function(n){
            var spread = (mode === 'all') || (mode === 'l1' && depth === 0);
            return {
                id: n.id,
                title: n.title || n.name,
                spread: spread,
                level_no: n.level_no,
                weight: n.weight,
                score_total: n.score_total,
                code: n.code,
                sort_no: n.sort_no,
                name: n.name,
                description: n.description || '',
                parent_id: n.parent_id,
                children: (n.children && n.children.length) ? toTreeData(n.children, mode, depth + 1) : []
            };
        });
    }

    function renderTree(mode){
        $('#treeBox').empty();
        tree.render({
            elem: '#treeBox',
            data: toTreeData(treeData, mode),
            showCheckbox: false,
            onlyIconControl: true,
            click: function(obj){
                currentIndicatorId = obj.data.id || 0;
                currentNode = nodeMap[currentIndicatorId] || obj.data;
                $('#treeBox .layui-tree-set').removeClass('tm-active');
                if (obj.elem && obj.elem.length) obj.elem.addClass('tm-active');
                fillIndicatorForm(currentNode);
                loadQuestions();
            }
        });
    }

    function loadMeta(cb){
        var vid = $('#versionId').val();
        $.getJSON('/TmIndicator/versionMeta', {versionId: vid}, function(res){
            if (res.success || res.code===0) setEditMode(!!(res.data && res.data.can_edit));
            else setEditMode(false);
            if (cb) cb();
        });
    }

    function loadTree(){
        var vid = $('#versionId').val();
        loadMeta(function(){
            $.getJSON('/TmIndicator/tree', {versionId: vid}, function(res){
                if (!(res.success || res.code===0)) { layer.msg(res.msg||'加载失败'); return; }
                treeData = res.data || [];
                nodeMap = {};
                walk(treeData, function(n){ nodeMap[n.id] = n; });
                renderTree('l1');
                currentIndicatorId = 0;
                currentNode = null;
                fillIndicatorForm(null);
                loadQuestions();
            });
        });
    }

    function loadQuestions(){
        var vid = $('#versionId').val();
        $('#qBox').html('<div class="empty-tip">加载中...</div>');
        $.getJSON('/TmIndicator/questions', {versionId: vid, indicatorId: currentIndicatorId, page:1, limit:200}, function(res){
            if (!(res.code===0 || res.success)) { $('#qBox').html('<div class="empty-tip">'+(res.msg||'加载失败')+'</div>'); return; }
            var list = res.data || [];
            $('#qCount').text(res.count||list.length);
            if (!list.length) { $('#qBox').html('<div class="empty-tip">暂无题目'+(canEdit?'，可点击右上角新增':'')+'</div>'); return; }
            var html = '';
            list.forEach(function(q, idx){
                html += '<div class="q-item" data-id="'+q.id+'">';
                if (q.indicator_name) html += '<div class="q-indicator">'+q.indicator_name+'</div>';
                html += '<div class="q-title"><span class="q-no">'+(idx+1)+'</span><span>'+q.title+'</span></div>';
                (q.options||[]).forEach(function(o){
                    var w = (o.score_ratio != null ? o.score_ratio : '');
                    html += '<div class="opt" data-option-id="'+(o.id||'')+'">';
                    html += '<span class="opt-text">○ '+o.content+'</span>';
                    if (canEdit) {
                        html += '<label class="opt-w">得分比例 <input type="number" class="opt-weight-input" min="0" max="1" step="0.01" value="'+w+'" data-option-id="'+(o.id||'')+'" data-origin="'+w+'"></label>';
                    } else {
                        html += '<span class="opt-w">得分比例 '+w+'</span>';
                    }
                    html += '</div>';
                });
                if (canEdit) {
                    html += '<div class="q-actions">'
                        + '<button type="button" class="pear-btn pear-btn-xs btn-edit-q" data-id="'+q.id+'">编辑</button> '
                        + '<button type="button" class="pear-btn pear-btn-xs pear-btn-danger btn-del-q" data-id="'+q.id+'">删除</button>'
                        + '</div>';
                }
                html += '</div>';
            });
            $('#qBox').html(html);
        });
    }

    // 列表内直接改选项得分比例 → POST /TmIndicator/saveOptionWeight
    $(document).on('change', '.opt-weight-input', function(){
        var $el = $(this);
        var optionId = $el.data('option-id');
        var val = $el.val();
        var origin = $el.attr('data-origin');
        if (!optionId) { layer.msg('选项无效'); return; }
        $.post('/TmIndicator/saveOptionWeight', {
            version_id: $('#versionId').val(),
            option_id: optionId,
            score_ratio: val,
            weight: val
        }, function(res){
            layer.msg(res.msg||'');
            if (res.success || res.code===0) {
                $el.attr('data-origin', val);
            } else {
                $el.val(origin);
            }
        }, 'json');
    });

    function defaultOptions(){
        return [
            {content:'完善，满足工作需求', score_ratio:1},
            {content:'一般，部分满足工作需求', score_ratio:0.75},
            {content:'不太完善，较少满足工作需求', score_ratio:0.5},
            {content:'未建立工作标准，无法满足工作需求', score_ratio:0.25}
        ];
    }

    function renderOpts(opts){
        var html = '<div class="opt-head"><span class="h-content">选项内容</span><span class="h-ratio">得分比例</span><span class="h-act"></span></div>';
        (opts||[]).forEach(function(o){
            html += '<div class="opt-row">'
                + '<input type="hidden" class="opt-id" value="'+(o.id||'')+'">'
                + '<input type="text" class="layui-input opt-content" value="'+(o.content||'').replace(/"/g,'&quot;')+'" placeholder="选项内容">'
                + '<input type="number" step="0.01" min="0" max="1" class="layui-input ratio opt-ratio" value="'+(o.score_ratio!=null?o.score_ratio:1)+'" placeholder="比例" title="选项得分比例">'
                + '<button type="button" class="pear-btn pear-btn-xs pear-btn-danger btn-rm-opt">删</button>'
                + '</div>';
        });
        $('#optBox').html(html);
    }

    /** 由三级指标 ID 反查一/二/三级路径 */
    function pathOfIndicator(indicatorId){
        var path = {l1: 0, l2: 0, l3: 0};
        var n = nodeMap[indicatorId];
        if (!n) return path;
        var lv = parseInt(n.level_no, 10);
        if (lv === 3) {
            path.l3 = n.id;
            var l2 = nodeMap[n.parent_id];
            if (l2) {
                path.l2 = l2.id;
                var l1 = nodeMap[l2.parent_id];
                if (l1) path.l1 = l1.id;
            }
        } else if (lv === 2) {
            path.l2 = n.id;
            var p1 = nodeMap[n.parent_id];
            if (p1) path.l1 = p1.id;
        } else if (lv === 1) {
            path.l1 = n.id;
        }
        return path;
    }

    function childrenOf(parentId){
        var list = [];
        if (!parentId) {
            (treeData || []).forEach(function(n){ list.push(n); });
            return list;
        }
        var p = nodeMap[parentId];
        return (p && p.children) ? p.children.slice() : [];
    }

    function fillSelect($sel, rows, placeholder, selectedId){
        $sel.empty().append('<option value="">'+placeholder+'</option>');
        (rows || []).forEach(function(n){
            $sel.append('<option value="'+n.id+'">'+(n.name || n.title || ('#'+n.id))+'</option>');
        });
        if (selectedId) $sel.val(String(selectedId));
    }

    function syncQIndicatorId(){
        var l3 = $('#selL3').val() || '';
        $('#qIndicatorId').val(l3);
    }

    var cascadeToken = 0;
    function bindIndicatorCascade(pref){
        pref = pref || {l1:0, l2:0, l3:0};
        var token = ++cascadeToken;
        fillSelect($('#selL1'), childrenOf(0), '请选择一级指标', pref.l1 || '');
        fillSelect($('#selL2'), pref.l1 ? childrenOf(pref.l1) : [], pref.l1 ? '请选择二级指标' : '请先选一级', pref.l2 || '');
        fillSelect($('#selL3'), pref.l2 ? childrenOf(pref.l2) : [], pref.l2 ? '请选择三级指标' : '请先选二级', pref.l3 || '');
        syncQIndicatorId();
        form.render('select', 'qForm');

        form.on('select(selL1)', function(data){
            if (token !== cascadeToken) return;
            var l1 = data.value;
            fillSelect($('#selL2'), l1 ? childrenOf(l1) : [], l1 ? '请选择二级指标' : '请先选一级', '');
            fillSelect($('#selL3'), [], '请先选二级', '');
            syncQIndicatorId();
            form.render('select', 'qForm');
        });
        form.on('select(selL2)', function(data){
            if (token !== cascadeToken) return;
            var l2 = data.value;
            fillSelect($('#selL3'), l2 ? childrenOf(l2) : [], l2 ? '请选择三级指标' : '请先选二级', '');
            syncQIndicatorId();
            form.render('select', 'qForm');
        });
        form.on('select(selL3)', function(){
            if (token !== cascadeToken) return;
            syncQIndicatorId();
        });
    }

    function openQForm(q){
        if (!treeData || !treeData.length) {
            layer.msg('当前版本暂无指标树，无法维护题目');
            return;
        }
        var pref;
        if (q && q.indicator_id) {
            pref = pathOfIndicator(q.indicator_id);
        } else if (currentNode) {
            pref = pathOfIndicator(currentNode.id);
        } else {
            pref = {l1:0, l2:0, l3:0};
        }
        layer.open({
            type:1, title: q ? '编辑题目' : '新增题目',
            area:['720px','720px'], content: $('#qTpl').html(),
            success: function(){
                form.render(null, 'qForm');
                form.val('qForm', {
                    id: q ? q.id : '',
                    title: q ? q.title : '',
                    sort_no: q ? q.sort_no : 0
                });
                bindIndicatorCascade(pref);
                renderOpts(q && q.options && q.options.length ? q.options : defaultOptions());
                $('#btnCancelQ').on('click', function(){ layer.closeAll(); });
                $('#btnAddOpt').on('click', function(){
                    $('#optBox').append(
                        '<div class="opt-row">'
                        + '<input type="hidden" class="opt-id" value="">'
                        + '<input type="text" class="layui-input opt-content" placeholder="选项内容">'
                        + '<input type="number" step="0.01" min="0" max="1" class="layui-input ratio opt-ratio" value="0.25" placeholder="比例" title="选项得分比例">'
                        + '<button type="button" class="pear-btn pear-btn-xs pear-btn-danger btn-rm-opt">删</button>'
                        + '</div>'
                    );
                });
                $(document).off('click.rmopt').on('click.rmopt', '.btn-rm-opt', function(){
                    $(this).closest('.opt-row').remove();
                });
                form.on('submit(saveQ)', function(data){
                    syncQIndicatorId();
                    var indicatorId = $('#qIndicatorId').val();
                    if (!indicatorId) {
                        layer.msg('请选择三级指标');
                        return false;
                    }
                    var options = [];
                    $('#optBox .opt-row').each(function(i){
                        options.push({
                            id: $(this).find('.opt-id').val() || 0,
                            content: $(this).find('.opt-content').val(),
                            score_ratio: $(this).find('.opt-ratio').val(),
                            sort_no: i+1
                        });
                    });
                    $.post('/TmIndicator/saveQuestion', {
                        version_id: $('#versionId').val(),
                        id: data.field.id,
                        indicator_id: indicatorId,
                        title: data.field.title,
                        sort_no: data.field.sort_no,
                        options: JSON.stringify(options)
                    }, function(res){
                        layer.msg(res.msg||'');
                        if (res.success || res.code===0) { layer.closeAll(); loadQuestions(); loadTree(); }
                    }, 'json');
                    return false;
                });
            }
        });
    }

    /**
     * 返回指标版本列表。
     * 注意：不要只 closeCurrentTab——Pear 会切到相邻页签（可能是操作日志）。
     * 正确做法：先打开/激活「指标版本」，再关掉题库页签。
     */
    function backToVersionList(){
        var versionUrl = '/TmIndicatorVersion/index';

        // 弹层打开：关掉弹层即回到底下的版本列表
        try {
            if (parent && parent.layer && window.name) {
                var idx = parent.layer.getFrameIndex(window.name);
                if (idx !== undefined && idx !== null && idx !== '') {
                    parent.layer.close(idx);
                    return;
                }
            }
        } catch (e) {}

        try {
            var $p = parent && parent.layui && (parent.layui.jquery || parent.$);
            var admin = parent && parent.layui && parent.layui.admin;
            if ($p && $p('.layui-tab-title').length) {
                // 1) 找到已有「指标版本」页签并激活
                var $verLi = null;
                $p('.layui-tab-title li').each(function(){
                    var layId = String($p(this).attr('lay-id') || '');
                    var idx = $p(this).index();
                    var src = '';
                    try {
                        src = $p('.layui-tab-content .layui-tab-item').eq(idx).find('iframe').attr('src') || '';
                    } catch (eSrc) {}
                    if (src.indexOf('TmIndicatorVersion') >= 0 || layId.indexOf('TmIndicatorVersion') >= 0) {
                        $verLi = $p(this);
                        return false;
                    }
                });
                if ($verLi && $verLi.length) {
                    $verLi.trigger('click');
                } else if (admin && typeof admin.addTab === 'function') {
                    admin.addTab('tm-indicator-version', '指标版本', versionUrl);
                }

                // 2) 关掉所有题库页签（tm-bank-*），避免误留脏页签
                setTimeout(function(){
                    $p('.layui-tab-title li').each(function(){
                        var layId = String($p(this).attr('lay-id') || '');
                        if (layId.indexOf('tm-bank-') === 0) {
                            $p(this).find('.layui-tab-close').trigger('click');
                        }
                    });
                }, 80);
                return;
            }
            if (admin && typeof admin.addTab === 'function') {
                admin.addTab('tm-indicator-version', '指标版本', versionUrl);
                return;
            }
        } catch (e2) {}

        location.href = versionUrl;
    }

    $('#btnBackVersion').on('click', backToVersionList);

    form.on('select(versionId)', function(){ loadTree(); });
    $('#btnAddQ').on('click', function(){ openQForm(null); });
    $('#btnSaveInd').on('click', function(){
        if (!canEdit) {
            layer.msg('当前版本不可编辑');
            return;
        }
        var id = parseInt($('#indId').val() || '0', 10) || 0;
        if (id <= 0) {
            layer.msg('请先选择左侧指标');
            return;
        }
        var name = $.trim($('#indName').val() || '');
        if (!name) {
            layer.msg('请填写指标名称');
            return;
        }
        var node = currentNode || nodeMap[id] || {};
        var lv = parseInt(node.level_no, 10) || 0;
        // 二级分数只是下级合计展示，保存时不改 weight，避免把合计写进无用字段
        var weight = (lv === 2)
            ? (node.weight != null ? node.weight : 0)
            : $('#indWeight').val();
        $.post('/TmIndicator/saveIndicator', {
            version_id: $('#versionId').val(),
            id: id,
            name: name,
            description: node.description || '',
            code: node.code || '',
            weight: weight,
            sort_no: node.sort_no != null ? node.sort_no : 0,
            status: 1
        }, function(res){
            layer.msg(res.msg || '');
            if (res.success || res.code === 0) {
                var keepId = id;
                loadMeta(function(){
                    $.getJSON('/TmIndicator/tree', {versionId: $('#versionId').val()}, function(tres){
                        if (!(tres.success || tres.code===0)) { return; }
                        treeData = tres.data || [];
                        nodeMap = {};
                        walk(treeData, function(n){ nodeMap[n.id] = n; });
                        renderTree('l1');
                        currentIndicatorId = keepId;
                        currentNode = nodeMap[keepId] || null;
                        fillIndicatorForm(currentNode);
                        loadQuestions();
                    });
                });
            }
        }, 'json');
    });
    $(document).on('click', '.btn-edit-q', function(){
        var id = $(this).data('id');
        $.getJSON('/TmIndicator/questionDetail', {id: id}, function(res){
            if (!(res.success || res.code===0)) { layer.msg(res.msg||'加载失败'); return; }
            openQForm(res.data);
        });
    });
    $(document).on('click', '.btn-del-q', function(){
        var id = $(this).data('id');
        layer.confirm('确认删除该题目？', function(i){
            layer.close(i);
            $.post('/TmIndicator/deleteQuestion', {
                version_id: $('#versionId').val(), id: id
            }, function(res){
                layer.msg(res.msg||'');
                if (res.success || res.code===0) { loadQuestions(); loadTree(); }
            }, 'json');
        });
    });

    loadTree();
});
</script>
</body>
</html>

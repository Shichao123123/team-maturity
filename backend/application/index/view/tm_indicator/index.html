<!DOCTYPE html>
<html>
<head>
    {include file="common/meta" /}
    {include file="common/css" /}
    <style>
        :root {
            --c-teal: #0d9488;
            --c-teal-deep: #0f766e;
            --c-coral: #f97316;
            --c-amber: #f59e0b;
            --c-sky: #0284c7;
            --c-rose: #e11d48;
            --c-bg: linear-gradient(145deg, #ecfeff 0%, #fff7ed 45%, #f0fdf4 100%);
        }
        body.pear-container {
            background: var(--c-bg) !important;
            min-height: 100vh;
            padding: 16px !important;
        }
        .toolbar {
            background: #fff;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(13,148,136,.08);
            border: 1px solid rgba(13,148,136,.15);
        }
        .wrap {
            display:flex;
            gap:14px;
            align-items:flex-start;
        }
        .left, .right {
            background:#fff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 8px 24px rgba(15,118,110,.08);
        }
        .left {
            width:360px;
            flex: 0 0 360px;
            border-top: 4px solid var(--c-teal);
            position: sticky;
            top: 12px;
            max-height: calc(100vh - 24px);
            display: flex;
            flex-direction: column;
            z-index: 5;
        }
        .right {
            flex:1;
            min-width: 0;
            min-height:70vh;
            border-top: 4px solid var(--c-coral);
        }
        .left-hd, .right-hd {
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom:12px; padding-bottom:10px;
            border-bottom: 1px dashed rgba(13,148,136,.25);
        }
        .left-hd .tit, .right-hd .tit {
            font-weight:700; font-size:16px; color:#0f766e;
            display:flex; align-items:center; gap:8px;
        }
        .left-hd .tit::before {
            content:'';
            width:10px; height:10px; border-radius:50%;
            background: linear-gradient(135deg, #2dd4bf, #0284c7);
            box-shadow: 0 0 0 3px rgba(45,212,191,.25);
        }
        .right-hd .tit { color:#c2410c; }
        .right-hd .tit::before {
            content:'';
            width:10px; height:10px; border-radius:50%;
            background: linear-gradient(135deg, #fb923c, #f43f5e);
            box-shadow: 0 0 0 3px rgba(251,146,60,.25);
        }
        #qCount {
            display:inline-block;
            margin-left:8px;
            padding:2px 10px;
            border-radius:999px;
            background: linear-gradient(90deg, #fb923c, #f43f5e);
            color:#fff; font-size:12px; font-weight:600;
        }
        .ops .pear-btn {
            margin-left:6px;
            border-radius:999px !important;
            border: none !important;
            color:#fff !important;
            background: linear-gradient(90deg, #14b8a6, #0ea5e9) !important;
        }
        .ops #btnCollapse {
            background: linear-gradient(90deg, #f59e0b, #f97316) !important;
        }
        #treeBox {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding-right: 4px;
        }
        .layui-tree-entry { border-radius:8px; transition: all .15s ease; }
        .layui-tree-entry:hover { background: rgba(45,212,191,.12); }
        .layui-tree-set.tm-active > .layui-tree-entry {
            background: linear-gradient(90deg, rgba(20,184,166,.22), rgba(14,165,233,.18));
            box-shadow: inset 3px 0 0 #0d9488;
        }
        .layui-tree-txt { color:#134e4a; font-weight:500; }
        .layui-tree-iconClick .layui-tree-icon {
            border-color: #2dd4bf !important;
            background: #ecfeff !important;
        }
        .layui-tree-iconClick .layui-tree-icon i { color:#0d9488 !important; }

        .q-item {
            border: 1px solid rgba(249,115,22,.12);
            background: linear-gradient(180deg, #fff 0%, #fffaf5 100%);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 10px rgba(249,115,22,.06);
        }
        .q-title {
            font-weight:700; color:#9a3412; margin-bottom:8px; line-height:1.55;
            display:flex; gap:10px; align-items:flex-start;
        }
        .q-no {
            flex:0 0 auto;
            min-width:28px; height:28px; line-height:28px; text-align:center;
            border-radius:8px; color:#fff; font-size:13px;
            background: linear-gradient(135deg, #f97316, #e11d48);
        }
        .q-indicator {
            font-weight:700;
            font-size:15px;
            color:#0f766e;
            margin-bottom:10px;
            line-height:1.4;
            padding-bottom:8px;
            border-bottom:1px dashed rgba(13,148,136,.25);
        }
        .opt {
            margin:6px 0;
            padding:8px 12px;
            border-radius:8px;
            background:#f0fdfa;
            border:1px solid rgba(13,148,136,.15);
            color:#115e59;
            line-height:1.5;
        }
        .opt:nth-child(odd) { background:#fff7ed; border-color:rgba(249,115,22,.18); color:#9a3412; }
        .measure {
            margin-top:12px;
            background: linear-gradient(135deg, #ecfeff, #e0f2fe);
            border: 1px solid rgba(14,165,233,.25);
            padding:10px 12px;
            border-radius:10px;
            color:#075985;
            font-size:13px;
            white-space:pre-wrap;
        }
        .measure b { color:#0369a1; }
        .empty-tip { color:#0f766e; padding:24px 8px; }
    </style>
</head>
<body class="pear-container">
<div class="toolbar layui-form">
    <div class="layui-inline">
        <select id="versionId" lay-filter="versionId">
            {volist name="versions" id="v"}
            <option value="{$v.id}" {if condition="$v.id == $defaultVersionId"}selected{/if}>{$v.name}（{$v.version_no}）</option>
            {/volist}
        </select>
    </div>
</div>
<div class="wrap">
    <div class="left">
        <div class="left-hd">
            <div class="tit">指标树</div>
            <div class="ops">
                <button type="button" class="pear-btn pear-btn-xs" id="btnExpand">展开</button>
                <button type="button" class="pear-btn pear-btn-xs" id="btnCollapse">收起</button>
            </div>
        </div>
        <div id="treeBox"></div>
    </div>
    <div class="right">
        <div class="right-hd">
            <div class="tit">题目列表 <span id="qCount">0</span></div>
        </div>
        <div id="qBox" class="empty-tip">请选择左侧指标或版本</div>
    </div>
</div>
<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
<script>
layui.use(['form','jquery','layer','tree'], function(){
    var form = layui.form, $ = layui.jquery, layer = layui.layer, tree = layui.tree;
    var currentIndicatorId = 0;
    var treeData = [];

    function toTreeData(nodes, mode, depth){
        depth = depth || 0;
        return (nodes || []).map(function(n){
            var spread = false;
            if (mode === 'all') spread = true;
            else if (mode === 'l1') spread = (depth === 0);
            return {
                id: n.id,
                title: n.title || n.name,
                spread: spread,
                children: (n.children && n.children.length) ? toTreeData(n.children, mode, depth + 1) : []
            };
        });
    }

    function renderTree(mode){
        $('#treeBox').empty();
        tree.render({
            elem: '#treeBox',
            data: toTreeData(treeData, mode),
            showCheckbox: false,
            onlyIconControl: true,
            click: function(obj){
                currentIndicatorId = obj.data.id || 0;
                $('#treeBox .layui-tree-set').removeClass('tm-active');
                if (obj.elem && obj.elem.length) {
                    obj.elem.addClass('tm-active');
                }
                loadQuestions();
            }
        });
    }

    function loadTree(){
        var vid = $('#versionId').val();
        $.getJSON('/TmIndicator/tree', {versionId: vid}, function(res){
            if (!(res.success || res.code===0)) { layer.msg(res.msg||'加载失败'); return; }
            treeData = res.data || [];
            renderTree('l1');
            currentIndicatorId = 0;
            loadQuestions();
        });
    }

    function loadQuestions(){
        var vid = $('#versionId').val();
        $('#qBox').html('<div class="empty-tip">加载中...</div>');
        $.getJSON('/TmIndicator/questions', {versionId: vid, indicatorId: currentIndicatorId, page:1, limit:200}, function(res){
            if (!(res.code===0 || res.success)) { $('#qBox').html('<div class="empty-tip">'+(res.msg||'加载失败')+'</div>'); return; }
            var list = res.data || [];
            $('#qCount').text(res.count||list.length);
            if (!list.length) { $('#qBox').html('<div class="empty-tip">暂无题目</div>'); return; }
            var html = '';
            list.forEach(function(q, idx){
                html += '<div class="q-item">';
                if (q.indicator_name) {
                    html += '<div class="q-indicator">'+q.indicator_name+'</div>';
                }
                html += '<div class="q-title"><span class="q-no">'+(idx+1)+'</span><span>'+q.title+'</span></div>';
                (q.options||[]).forEach(function(o){
                    html += '<div class="opt">○ '+o.content+'</div>';
                });
                if (q.measure) html += '<div class="measure"><b>建设措施：</b>'+q.measure+'</div>';
                html += '</div>';
            });
            $('#qBox').html(html);
        });
    }

    form.on('select(versionId)', function(){ loadTree(); });
    $('#btnExpand').on('click', function(){ renderTree('all'); });
    $('#btnCollapse').on('click', function(){ renderTree('none'); });
    loadTree();
});
</script>
</body>
</html>

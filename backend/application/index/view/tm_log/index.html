<!DOCTYPE html>
<html>
<head>
    {include file="common/meta" /}
    {include file="common/css" /}
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" onsubmit="return false;">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <select name="module">
                        <option value="">全部模块</option>
                        <option value="login">登录</option>
                        <option value="admin">管理员</option>
                        <option value="role">角色</option>
                        <option value="org">组织</option>
                        <option value="team">班组</option>
                        <option value="member">成员</option>
                        <option value="import">导入</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" name="dateFrom" id="dateFrom" placeholder="开始日期" class="layui-input" autocomplete="off" style="width:130px;">
                </div>
                <div class="layui-inline">
                    <input type="text" name="dateTo" id="dateTo" placeholder="结束日期" class="layui-input" autocomplete="off" style="width:130px;">
                </div>
                <div class="layui-inline">
                    <input type="text" name="keyword" placeholder="操作/明细/IP/账号" class="layui-input" style="width:180px;">
                </div>
                <div class="layui-inline">
                    <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="search">查询</button>
                </div>
            </div>
        </form>
        <table id="dataTable" lay-filter="dataTable"></table>
    </div>
</div>

<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
<script>
layui.use(['table','form','laydate','jquery','layer'], function(){
    var table = layui.table, form = layui.form, laydate = layui.laydate;
    var $ = layui.jquery;

    laydate.render({elem: '#dateFrom', type: 'date'});
    laydate.render({elem: '#dateTo', type: 'date'});

    table.render({
        elem: '#dataTable',
        id: 'dataTable',
        url: '/TmLog/getList',
        page: true,
        cols: [[
            {field:'created_at', title:'时间', width:170},
            {field:'admin_name', title:'操作人', width:110},
            {field:'module', title:'模块', width:100},
            {field:'action', title:'动作', width:120},
            {field:'biz_id', title:'业务ID', width:100, templet: function(d){ return d.biz_id || ''; }},
            {field:'detail', title:'明细', minWidth:220, templet: function(d){ return d.detail || ''; }},
            {field:'ip', title:'IP', width:130, templet: function(d){ return d.ip || ''; }}
        ]]
    });

    form.on('submit(search)', function(data){
        table.reload('dataTable', {where: data.field, page:{curr:1}});
        return false;
    });
});
</script>
</body>
</html>

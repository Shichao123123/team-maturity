<!DOCTYPE html>
<html>
<head>
    {include file="common/meta" /}
    {include file="common/css" /}
    <style>
        html, body { height: 100%; }
        .pear-container { height: 100%; box-sizing: border-box; }
        .layui-card { height: 100%; display: flex; flex-direction: column; margin-bottom: 0; }
        .layui-card-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .filter-form { flex: 0 0 auto; }
        #dataTableBox { flex: 1; min-height: 0; }
    </style>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form filter-form" lay-filter="filterForm" onsubmit="return false;">
            <div class="layui-form-item" style="margin-bottom:10px;">
                <div class="layui-inline">
                    <select name="module" lay-filter="autoFilter">
                        <option value="">全部模块</option>
                        {volist name="modules" id="m"}
                        <option value="{$m['value']}">{$m['label']}</option>
                        {/volist}
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" name="dateFrom" id="dateFrom" placeholder="开始日期" class="layui-input" autocomplete="off" style="width:130px;">
                </div>
                <div class="layui-inline">
                    <input type="text" name="dateTo" id="dateTo" placeholder="结束日期" class="layui-input" autocomplete="off" style="width:130px;">
                </div>
                <div class="layui-inline">
                    <input type="text" name="keyword" placeholder="操作/明细/IP/账号" class="layui-input" style="width:180px;">
                </div>
            </div>
        </form>
        <div id="dataTableBox">
            <table id="dataTable" lay-filter="dataTable"></table>
        </div>
    </div>
</div>

<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
<script>
layui.use(['table','form','laydate','jquery','layer'], function(){
    var table = layui.table, form = layui.form, laydate = layui.laydate;
    var $ = layui.jquery;
    form.render('select');

    function esc(s){
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function tableHeight(){
        var h = $('#dataTableBox').height();
        return h > 200 ? h : Math.max(280, $(window).height() - 160);
    }

    function reloadFilter(){
        table.reload('dataTable', {
            where: form.val('filterForm') || {},
            page: {curr: 1},
            height: tableHeight()
        });
    }

    form.on('select(autoFilter)', function(){ reloadFilter(); });
    laydate.render({elem: '#dateFrom', type: 'date', done: function(){ reloadFilter(); }});
    laydate.render({elem: '#dateTo', type: 'date', done: function(){ reloadFilter(); }});
    var keywordTimer = null;
    $('form[lay-filter="filterForm"] input[name="keyword"]').on('input', function(){
        clearTimeout(keywordTimer);
        keywordTimer = setTimeout(reloadFilter, 300);
    });

    table.render({
        elem: '#dataTable',
        id: 'dataTable',
        url: '/TmLog/getList',
        page: true,
        height: tableHeight(),
        cellMinWidth: 90,
        even: true,
        cols: [[
            {field:'created_at', title:'时间', width:170, unresize: true},
            {field:'admin_name', title:'操作人', width:100, unresize: true},
            {field:'module_text', title:'模块', width:110, unresize: true, templet: function(d){
                return esc(d.module_text || d.module || '');
            }},
            {field:'action_text', title:'动作', width:100, unresize: true, templet: function(d){
                return esc(d.action_text || d.action || '');
            }},
            {field:'detail_text', title:'明细', minWidth:240, templet: function(d){
                return esc(d.detail_text || d.detail || '');
            }},
            {field:'ip', title:'IP', width:130, unresize: true, templet: function(d){
                return esc(d.ip || '');
            }}
        ]],
        done: function(){
            setTimeout(function(){ table.resize('dataTable'); }, 50);
        }
    });

    var resizeTimer = null;
    $(window).on('resize', function(){
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function(){
            table.reload('dataTable', {
                height: tableHeight(),
                where: form.val('filterForm') || {}
            });
        }, 120);
    });
});
</script>
</body>
</html>

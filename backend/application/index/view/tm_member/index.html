<!DOCTYPE html>
<html>
<head>
    {include file="common/meta" /}
    {include file="common/css" /}
    <style>
        :root {
            --arc-bg: #00142d;
            --arc-panel: #032541;
            --arc-line: #12577d;
            --arc-text: #e7f6ff;
            --arc-muted: #8caec8;
            --arc-accent: #22dfff;
            --arc-accent-soft: rgba(34,223,255,.14);
            --arc-team: #45e7b5;
            --arc-team-soft: rgba(69,231,181,.13);
            --arc-shadow: 0 8px 24px rgba(0,7,23,.3);
        }
        body.pear-container { background:
            linear-gradient(rgba(24,118,169,.055) 1px, transparent 1px),
            linear-gradient(90deg, rgba(24,118,169,.055) 1px, transparent 1px),
            radial-gradient(900px 420px at 0% -10%, rgba(0,172,255,.15), transparent 55%),
            var(--arc-bg) !important; }
        .archive-layout {
            display:flex; gap:16px; align-items:stretch;
            min-height:calc(100vh - 110px); padding:4px;
        }
        .archive-tree-panel {
            width:300px; flex:0 0 300px; background:var(--arc-panel);
            border:1px solid var(--arc-line); border-radius:6px;
            box-shadow: var(--arc-shadow); display:flex; flex-direction:column;
            overflow:hidden;
        }
        .archive-tree-head {
            padding:14px 14px 10px; border-bottom:1px solid var(--arc-line);
            background:linear-gradient(180deg,#073b62 0%,#042b49 100%);
        }
        .archive-tree-title {
            font-weight:700; color:var(--arc-text); margin:0 0 2px; font-size:15px;
            letter-spacing:.2px;
        }
        .archive-tree-sub { color:var(--arc-muted); font-size:12px; margin:0 0 10px; }
        .archive-tree-actions { display:flex; gap:6px; }
        .archive-tree-actions .pear-btn {
            border-radius:999px !important; padding:0 12px !important; height:28px; line-height:28px;
            border:1px solid #159bd1 !important; background:linear-gradient(180deg,#0e72bb,#075389) !important; color:#eaf8ff !important;
        }
        .archive-tree-actions .pear-btn:hover { border-color:var(--arc-accent) !important; color:#fff !important; }
        .archive-tree-body { padding:10px 10px 14px; overflow:auto; flex:1; background:linear-gradient(180deg,#032440,#021d35); }
        .archive-main-panel {
            flex:1; min-width:0; background:var(--arc-panel);
            border:1px solid var(--arc-line); border-radius:6px;
            box-shadow: var(--arc-shadow); padding:16px 18px 18px;
        }
        .archive-main-head {
            display:flex; align-items:center; justify-content:space-between; gap:12px;
            margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--arc-line);
        }
        .archive-current {
            display:inline-flex; align-items:center; gap:8px;
            margin:0; color:var(--arc-text); font-size:14px; font-weight:600;
        }
        .archive-current .chip {
            display:inline-block; max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            background:var(--arc-accent-soft); color:var(--arc-accent);
            border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600;
        }
        .archive-toolbar .layui-form-item { margin-bottom:12px; }
        .archive-toolbar .layui-input,
        .archive-toolbar .layui-form-select .layui-input {
            border-radius:4px !important; border-color:#167da7 !important;
        }
        .atree, .atree ul { list-style:none; margin:0; padding:0; }
        .atree-children { padding-left:12px; margin-left:10px; border-left:1px dashed #175679; }
        .atree li { margin:2px 0; }
        .anode {
            display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:10px;
            cursor:pointer; color:#bdd9ea; font-size:13px; line-height:1.35;
            border:1px solid transparent; transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .anode:hover { background:#07456a; border-color:#126f98; color:#fff; }
        .anode.active {
            background:linear-gradient(90deg,#09618c,#064366); border-color:#18bce8; color:#fff; font-weight:600;
            box-shadow:inset 3px 0 0 var(--arc-accent),0 0 12px rgba(24,188,232,.12);
        }
        .anode.is-team.active {
            background:linear-gradient(90deg,#08715f,#06483f); border-color:#38cfaa; color:#eafff8;
            box-shadow: inset 3px 0 0 var(--arc-team);
        }
        .anode .node-ico {
            width:22px; height:22px; border-radius:7px; flex:0 0 22px;
            display:inline-flex; align-items:center; justify-content:center;
            background:#073b5e; color:#75e9ff; border:1px solid #126b91; font-size:12px;
        }
        .anode.is-team .node-ico { background:#07483f; color:var(--arc-team); border-color:#16866e; }
        .anode.active .node-ico { background:#0982ae; color:#fff; box-shadow:0 0 8px rgba(34,223,255,.35); }
        .anode .node-text { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .atree .twist {
            width:16px; flex:0 0 16px; color:#77b7d8; user-select:none; text-align:center; font-size:11px;
        }
        .atree .twist.empty { visibility:hidden; }
        .paper-summary { color:#91b5cd; font-size:12px; line-height:1.5; }
        .paper-summary .score { color:#42e8ff; font-weight:600; }
        .paper-summary .level { color:#45e7b5; font-weight:600; }
        .result-hero {
            display:grid; grid-template-columns:1fr 1fr; gap:12px;
            margin-bottom:14px;
        }
        .result-box {
            background:#052f50; border:1px solid var(--arc-line); border-radius:5px; padding:12px 14px;
        }
        .result-box .label { color:#91b5cd; font-size:12px; margin-bottom:4px; }
        .result-box .value { font-size:22px; font-weight:700; color:#eaf8ff; }
        .result-box .sub { color:#9bbdd2; font-size:12px; margin-top:4px; }
        .answer-q { font-weight:600; color:#eaf8ff; }
        .answer-meta { color:#91b5cd; font-size:12px; }
        @media (max-width:720px){ .result-hero { grid-template-columns:1fr; } }
    </style>
</head>
<body class="pear-container">
<div class="archive-layout">
    <div class="archive-tree-panel">
        <div class="archive-tree-head">
            <div class="archive-tree-title">组织 / 班组</div>
            <p class="archive-tree-sub">点组织看范围成员，点班组看该班组</p>
            <div class="archive-tree-actions">
                <button type="button" class="pear-btn pear-btn-xs" id="btnTreeExpand">展开全部</button>
                <button type="button" class="pear-btn pear-btn-xs" id="btnTreeFold">折叠全部</button>
            </div>
        </div>
        <div class="archive-tree-body">
            <div class="anode active" id="treeAll" data-type="all" data-id="" data-name="全部">
                <span class="twist empty">·</span>
                <span class="node-ico">全</span>
                <span class="node-text">全部</span>
            </div>
            <div id="sideTree"></div>
        </div>
    </div>
    <div class="archive-main-panel">
        <div class="archive-main-head">
            <div class="archive-current">当前范围 <span class="chip" id="currentLabel">全部</span></div>
        </div>
        <form class="layui-form archive-toolbar" lay-filter="filterForm" onsubmit="return false;">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <select name="roleCode" lay-filter="autoFilter">
                        <option value="">全部角色</option>
                        {foreach name="roles" item="rn" key="rc"}
                        <option value="{$rc}">{$rn}</option>
                        {/foreach}
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" name="keyword" placeholder="搜索姓名 / 手机号" class="layui-input" style="width:200px;">
                </div>
                <div class="layui-inline">
                    <button type="button" class="pear-btn pear-btn-md pear-btn-primary" id="btnAdd">新增成员</button>
                    <a class="pear-btn pear-btn-md" href="/TmMember/importTemplate" title="可选：批量补录">下载模板</a>
                    <button type="button" class="pear-btn pear-btn-md pear-btn-success" id="btnImport" title="正式测评以小程序自助登记为主，导入非前置">导入</button>
                    <button type="button" class="pear-btn pear-btn-md" id="btnUndoImport" title="仅撤回最近一次成员导入">撤回导入</button>
                    <input type="file" id="fileImport" accept=".xls,.xlsx,.csv" style="display:none">
                </div>
            </div>
        </form>
        <table id="dataTable" lay-filter="dataTable"></table>
    </div>
</div>

<script type="text/html" id="bar">
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="papers">答题记录</a>
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script type="text/html" id="editTpl">
    <form class="layui-form" style="padding:20px;" lay-filter="editForm">
        <input type="hidden" name="id">
        <div class="layui-form-item">
            <label class="layui-form-label">班组</label>
            <div class="layui-input-block">
                <select name="team_id" lay-verify="required">
                    <option value="">请选择</option>
                    {volist name="teams" id="t"}
                    <option value="{$t.id}">{$t.name}</option>
                    {/volist}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">姓名</label>
            <div class="layui-input-block">
                <input type="text" name="name" required lay-verify="required" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input type="text" name="mobile" placeholder="可选；小程序自助登记可不填" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">岗位</label>
            <div class="layui-input-block">
                <input type="text" name="post_name" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">角色</label>
            <div class="layui-input-block">
                <select name="role_code">
                    {foreach name="roles" item="rn" key="rc"}
                    <option value="{$rc}">{$rn}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <select name="status">
                    <option value="1">启用</option>
                    <option value="0">停用</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="pear-btn pear-btn-primary" lay-submit lay-filter="save">保存</button>
            </div>
        </div>
    </form>
</script>

<script type="text/html" id="paperListTpl">
    <div style="padding:12px 16px 16px;">
        <div class="paper-summary" id="paperListHint" style="margin-bottom:10px;"></div>
        <table id="paperTable" lay-filter="paperTable"></table>
    </div>
</script>

<script type="text/html" id="paperBar">
    <a class="layui-btn layui-btn-xs" lay-event="detail">查看结果</a>
</script>

<script type="text/html" id="paperDetailTpl">
    <div style="padding:14px 16px 18px;" id="paperDetailBody">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;">
            <div class="layui-text" id="paperDetailMeta" style="flex:1;min-width:0;"></div>
            <div style="display:flex;gap:8px;flex-shrink:0;">
                <button type="button" class="pear-btn pear-btn-md pear-btn-primary" id="btnExportPaperPdf">导出PDF</button>
                <button type="button" class="pear-btn pear-btn-md" id="btnExportPaperDocx">导出Word</button>
            </div>
        </div>
        <div class="result-hero" id="paperResultHero"></div>
        <div class="paper-summary" style="margin:4px 0 10px;font-weight:600;color:#1e293b;" id="answerSectionTitle">逐题作答结果</div>
        <table id="answerTable" lay-filter="answerTable"></table>
    </div>
</script>

<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
<script>
layui.use(['table','form','jquery','layer'], function(){
    var table = layui.table, form = layui.form, $ = layui.jquery, layer = layui.layer;
    var selected = {type: 'all', id: '', name: '全部'};

    function fmtScore(v){
        if (v === null || v === undefined || v === '') return '—';
        return Number(v).toFixed(1);
    }

    function renderSideTree(nodes, $parent){
        if (!nodes || !nodes.length) return;
        var $ul = $('<ul class="atree"></ul>');
        nodes.forEach(function(n){
            var hasChild = n.children && n.children.length;
            var isTeam = n.node_type === 'team';
            var $li = $('<li></li>');
            var $row = $('<div class="anode"></div>')
                .attr('data-id', n.id)
                .attr('data-type', n.node_type || 'org')
                .attr('data-name', n.name);
            if (isTeam) $row.addClass('is-team');
            var $twist = $('<span class="twist"></span>').text(hasChild ? '▼' : '·');
            if (!hasChild) $twist.addClass('empty');
            $row.append($twist)
                .append($('<span class="node-ico"></span>').text(isTeam ? '班' : '组'))
                .append($('<span class="node-text"></span>').text(n.name));
            $li.append($row);
            if (hasChild) {
                var $childWrap = $('<div class="atree-children"></div>');
                renderSideTree(n.children, $childWrap);
                $li.append($childWrap);
                $twist.on('click', function(e){
                    e.stopPropagation();
                    var open = $twist.text() === '▼';
                    $twist.text(open ? '▶' : '▼');
                    $childWrap.toggle(!open);
                });
            }
            $ul.append($li);
        });
        $parent.append($ul);
    }

    function loadSideTree(){
        $.getJSON('/TmMember/sideTree', function(res){
            var $box = $('#sideTree').empty();
            if (!(res.success || res.code===0)) return;
            renderSideTree(res.data || [], $box);
        });
    }

    function expandSideTree(open){
        $('#sideTree .atree-children').toggle(!!open);
        $('#sideTree .twist').each(function(){
            var $t = $(this);
            if ($t.hasClass('empty')) return;
            $t.text(open ? '▼' : '▶');
        });
    }
    $('#btnTreeExpand').on('click', function(){ expandSideTree(true); });
    $('#btnTreeFold').on('click', function(){ expandSideTree(false); });

    function setActiveTree(){
        $('.archive-tree-panel .anode').removeClass('active');
        if (selected.type === 'all') {
            $('#treeAll').addClass('active');
            return;
        }
        $('.archive-tree-panel .anode[data-type="'+selected.type+'"][data-id="'+selected.id+'"]').addClass('active');
    }

    function listWhere(){
        var f = form.val('filterForm') || {};
        var w = {
            teamId: '',
            orgId: '',
            roleCode: f.roleCode || '',
            keyword: f.keyword || ''
        };
        if (selected.type === 'team') w.teamId = selected.id;
        if (selected.type === 'org') w.orgId = selected.id;
        return w;
    }

    function reloadList(){
        $('#currentLabel').text(selected.name || '全部');
        setActiveTree();
        table.reload('dataTable', {where: listWhere(), page: {curr: 1}});
    }

    form.on('select(autoFilter)', function(){ reloadList(); });
    var keywordTimer = null;
    $('form[lay-filter="filterForm"] input[name="keyword"]').on('input', function(){
        clearTimeout(keywordTimer);
        keywordTimer = setTimeout(reloadList, 300);
    });

    $(document).on('click', '.archive-tree-panel .anode', function(e){
        if ($(e.target).hasClass('twist')) return;
        selected = {
            type: $(this).attr('data-type') || 'all',
            id: $(this).attr('data-id') || '',
            name: $(this).attr('data-name') || $(this).text() || '全部'
        };
        reloadList();
    });

    table.render({
        elem: '#dataTable',
        id: 'dataTable',
        url: '/TmMember/getList',
        where: listWhere(),
        page: true,
        cols: [[
            {field:'name', title:'姓名', width:90},
            {field:'mobile', title:'手机号', width:120, templet: function(d){ return d.mobile || '—'; }},
            {field:'team_name', title:'班组', width:120},
            {field:'role_name', title:'角色', width:100},
            {field:'paper_cnt', title:'答卷', width:70, align:'center', templet: function(d){
                return (d.paper_cnt || 0) + '/' + (d.submitted_cnt || 0);
            }},
            {field:'latest_personal_score', title:'最近结果', minWidth:200, templet: function(d){
                if (!d.paper_cnt) return '<span class="paper-summary">暂无答题记录</span>';
                var html = '<div class="paper-summary">';
                html += (d.latest_batch_name || '未命名批次') + ' · ' + (d.latest_paper_status_text || '');
                if (d.latest_paper_status == 1) {
                    html += '<br>个人 <span class="score">' + fmtScore(d.latest_personal_score) + '</span>';
                    if (d.latest_level_name) html += '（' + d.latest_level_name + '）';
                    if (d.latest_team_score !== null && d.latest_team_score !== undefined && d.latest_team_score !== '') {
                        html += ' · 班组 <span class="level">' + fmtScore(d.latest_team_score) + '</span>';
                        if (d.latest_team_level_name) html += '（' + d.latest_team_level_name + '）';
                    }
                }
                html += '</div>';
                return html;
            }},
            {field:'status', title:'状态', width:70, templet: function(d){ return d.status==1?'启用':'停用'; }},
            {title:'操作', toolbar:'#bar', width:210, fixed:'right'}
        ]]
    });

    function openForm(row){
        layer.open({
            type:1, title: row && row.id ? '编辑成员':'新增成员', area:['520px','520px'],
            content: $('#editTpl').html(),
            success: function(){
                form.render(null, 'editForm');
                if (row) {
                    form.val('editForm', row);
                } else if (selected.type === 'team' && selected.id) {
                    form.val('editForm', {team_id: selected.id, status: 1, role_code: 'member'});
                }
                form.on('submit(save)', function(d){
                    var url = d.field.id ? '/TmMember/edit' : '/TmMember/add';
                    $.post(url, d.field, function(res){
                        layer.msg(res.msg||'');
                        if (res.success || res.code===0){ layer.closeAll('page'); reloadList(); }
                    }, 'json');
                    return false;
                });
            }
        });
    }

    function openPaperList(member){
        var memberId = member.id;
        layer.open({
            type:1,
            title: '答题记录 — ' + (member.name || ''),
            area:['860px','560px'],
            content: $('#paperListTpl').html(),
            success: function(){
                $('#paperListHint').text('共 ' + (member.paper_cnt || 0) + ' 份答卷，已提交 ' + (member.submitted_cnt || 0) + ' 份。点击「查看结果」看个人分、班组结果与逐题作答。');
                table.render({
                    elem: '#paperTable',
                    url: '/TmMember/paperList',
                    where: { member_id: memberId },
                    page: false,
                    parseData: function(res){
                        var list = (res.data && res.data.list) ? res.data.list : [];
                        return { code: (res.success || res.code===0) ? 0 : 1, msg: res.msg || '', count: list.length, data: list };
                    },
                    cols: [[
                        {field:'batch_name', title:'测评批次', minWidth:160},
                        {field:'team_name', title:'班组', width:110},
                        {field:'status_text', title:'状态', width:80},
                        {field:'personal_score', title:'个人分', width:90, templet: function(d){ return fmtScore(d.personal_score); }},
                        {field:'personal_level_name', title:'个人判级', width:100, templet: function(d){ return d.personal_level_name || '—'; }},
                        {field:'team_score', title:'班组分', width:90, templet: function(d){ return fmtScore(d.team_score); }},
                        {field:'team_level_name', title:'班组等级', width:100, templet: function(d){ return d.team_level_name || '—'; }},
                        {field:'answered_cnt', title:'已答', width:70, align:'center'},
                        {field:'submitted_at', title:'提交时间', width:160, templet: function(d){ return d.submitted_at || '—'; }},
                        {title:'操作', toolbar:'#paperBar', width:100, fixed:'right'}
                    ]]
                });
                table.on('tool(paperTable)', function(obj){
                    if (obj.event === 'detail') {
                        openPaperDetail(obj.data.paper_id, memberId, member.name);
                    }
                });
            }
        });
    }

    function openPaperDetail(paperId, memberId, memberName){
        var load = layer.load(2);
        $.getJSON('/TmMember/paperDetail', { paper_id: paperId, member_id: memberId }, function(res){
            layer.close(load);
            if (!(res.success || res.code===0) || !res.data) {
                layer.msg(res.msg || '加载失败');
                return;
            }
            var p = res.data.paper || {};
            var answers = res.data.answers || [];
            layer.open({
                type:1,
                title: '测评结果 — ' + (memberName || p.member_name || ''),
                closeBtn: 1,
                maxmin: true,
                shadeClose: true,
                offset: '0',
                area: ['100%', '100%'],
                btn: ['关闭'],
                yes: function(index){ layer.close(index); },
                content: $('#paperDetailTpl').html(),
                success: function(layero, index){
                    // 默认全屏，便于浏览全部逐题结果
                    try { layer.full(index); } catch (e) {}
                    layero.find('#btnExportPaperPdf').on('click', function(){
                        window.location.href = '/TmMember/exportPaperPdf?paper_id=' + paperId + '&member_id=' + (memberId || 0);
                    });
                    layero.find('#btnExportPaperDocx').on('click', function(){
                        window.location.href = '/TmMember/exportPaperDocx?paper_id=' + paperId + '&member_id=' + (memberId || 0);
                    });
                    $('#paperDetailMeta').html(
                        '<div><b>' + (p.batch_name || '') + '</b> · ' + (p.team_name || '') +
                        ' · ' + (p.status_text || '') +
                        (p.submitted_at ? (' · 提交于 ' + p.submitted_at) : '') +
                        '</div>'
                    );
                    var hero = '';
                    hero += '<div class="result-box"><div class="label">个人得分</div><div class="value">' + fmtScore(p.personal_score) + '</div>';
                    hero += '<div class="sub">' + (p.personal_level_name ? ('判级：' + p.personal_level_name) : '未提交或未算分') + '</div></div>';
                    hero += '<div class="result-box"><div class="label">班组结果</div><div class="value">' + fmtScore(p.team_score) + '</div>';
                    if (p.team_level_name) {
                        hero += '<div class="sub">等级：' + p.team_level_name + (p.team_submit_cnt ? (' · 提交 ' + p.team_submit_cnt + ' 人') : '') + '</div>';
                    } else {
                        hero += '<div class="sub">班组尚未算分或结果未公布</div>';
                    }
                    hero += '</div>';
                    if (p.personal_feature) {
                        hero += '<div class="result-box" style="grid-column:1 / -1;"><div class="label">等级特征</div><div class="sub" style="font-size:13px;line-height:1.6;">' + p.personal_feature + '</div></div>';
                    }
                    $('#paperResultHero').html(hero);
                    var qcnt = (res.data.question_cnt != null) ? res.data.question_cnt : answers.length;
                    var acnt = (res.data.answered_cnt != null) ? res.data.answered_cnt : answers.length;
                    $('#answerSectionTitle').text('逐题作答结果（共 ' + qcnt + ' 题，已答 ' + acnt + ' 题）');

                    setTimeout(function(){
                        table.render({
                            elem: '#answerTable',
                            id: 'memberAnswerTable',
                            data: answers,
                            page: false,
                            limit: Math.max(answers.length, 10),
                            even: true,
                            cols: [[
                                {field:'sort_no', title:'题号', width:66, align:'center', templet: function(d){ return d.sort_no || ''; }},
                                {field:'indicator_name', title:'指标', width:120, templet: function(d){ return d.indicator_name || '—'; }},
                                {field:'question_title', title:'题目', minWidth:220, templet: function(d){
                                    return '<div class="answer-q">' + (d.question_title || ('题目#' + d.question_id)) + '</div>';
                                }},
                                {field:'option_content', title:'所选答案', width:140, templet: function(d){
                                    if (!d.is_answered) return '<span style="color:#94a3b8;">未作答</span>';
                                    return d.option_content || ('选项#' + d.option_id);
                                }},
                                {field:'item_score', title:'得分', width:80, align:'center', templet: function(d){
                                    return d.is_answered ? fmtScore(d.item_score) : '—';
                                }},
                                {field:'weight', title:'满分', width:80, align:'center', templet: function(d){ return fmtScore(d.weight); }},
                                {field:'answered_at', title:'作答时间', width:160, templet: function(d){ return d.answered_at || '—'; }}
                            ]],
                            done: function(){ setTimeout(function(){ table.resize('memberAnswerTable'); }, 80); }
                        });
                    }, 100);
                }
            });
        }).fail(function(){
            layer.close(load);
            layer.msg('加载失败');
        });
    }

    $('#btnAdd').on('click', function(){ openForm(null); });
    $('#btnImport').on('click', function(){ $('#fileImport').click(); });
    $('#btnUndoImport').on('click', function(){
        layer.confirm('确认撤回最近一次成员导入？<br>将删除该次新增的成员，并还原该次改过的成员。', {
            title: '撤回上次导入',
            btn: ['确认撤回', '取消']
        }, function(index){
            layer.close(index);
            var load = layer.load(2);
            $.post('/TmMember/undoLastImport', {}, function(res){
                layer.close(load);
                layer.msg(res.msg || '');
                if (res.success || res.code === 0) { loadSideTree(); reloadList(); }
            }, 'json').fail(function(){
                layer.close(load);
                layer.msg('请求失败');
            });
        });
    });
    $('#fileImport').on('change', function(){
        var f = this.files[0];
        if (!f) return;
        var fd = new FormData();
        fd.append('file', f);
        var load = layer.load(2);
        $.ajax({
            url: '/TmMember/import', type: 'POST', data: fd,
            processData: false, contentType: false, dataType: 'json',
            success: function(res){
                layer.close(load);
                layer.msg(res.msg || '');
                if (res.success || res.code===0) { loadSideTree(); reloadList(); }
            },
            error: function(){ layer.close(load); layer.msg('上传失败'); },
            complete: function(){ $('#fileImport').val(''); }
        });
    });

    table.on('tool(dataTable)', function(obj){
        if (obj.event==='papers') openPaperList(obj.data);
        if (obj.event==='edit') openForm(obj.data);
        if (obj.event==='del') {
            layer.confirm('确认删除？', function(i){
                $.post('/TmMember/delete', {id: obj.data.id}, function(res){
                    layer.msg(res.msg||'');
                    if (res.success || res.code===0) reloadList();
                }, 'json');
                layer.close(i);
            });
        }
    });

    loadSideTree();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    {include file="common/meta" /}
    {include file="common/css" /}
    <style>
        body.pear-container { padding: 18px 22px 28px; }
        .mock-wrap { max-width: 1080px; margin: 0 auto; }
        .card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(5,49,84,.98), rgba(2,27,51,.98));
            border-radius: 6px;
            border: 1px solid #126b94;
            box-shadow: inset 0 0 24px rgba(0,156,221,.08), 0 10px 28px rgba(0,8,28,.3);
            padding: 22px 26px;
            margin-bottom: 16px;
        }
        .card::before { content:""; position:absolute; left:0; top:0; width:100%; height:2px; background:linear-gradient(90deg,#18dfff,rgba(24,223,255,.08) 65%,transparent); }
        .card h2 { position:relative; margin:0 0 9px; padding-left:13px; font-size:19px; color:#edf9ff; text-shadow:0 0 10px rgba(49,214,255,.2); }
        .card h2::before { content:""; position:absolute; left:0; top:2px; width:4px; height:20px; border-radius:2px; background:#27ddff; box-shadow:0 0 9px #27ddff; }
        .sub { color:#94b9d1; font-size:13px; line-height:1.7; margin-bottom:17px; }
        .start-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .start-row .layui-form-select { min-width: 280px; }
        .progress-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; padding-bottom:12px; color:#a8c8dd; font-size:13px;
            border-bottom:1px solid #124e70;
        }
        .progress-bar strong { color:#effaff; font-size:15px; }
        #answeredCnt { color:#31e4ff; font-weight:700; }
        .q-item {
            border:1px solid #11587d;
            border-radius:5px;
            padding:17px 20px;
            margin-bottom: 12px;
            background:linear-gradient(120deg,rgba(5,45,77,.88),rgba(3,34,61,.92));
            box-shadow:inset 0 0 15px rgba(0,127,190,.05);
        }
        .q-item.done { border-color:#12bee8; background:linear-gradient(120deg,rgba(5,61,96,.95),rgba(3,39,68,.95)); box-shadow:inset 3px 0 #22dfff,inset 0 0 18px rgba(0,176,222,.1); }
        .q-meta { color:#759bb5; font-size:12px; margin-bottom:6px; }
        .q-ind { color:#31e4d1; font-weight:600; font-size:13px; margin-bottom:6px; line-height:1.45; }
        .q-title { font-size:15px; color:#edf8ff; font-weight:600; margin-bottom:13px; line-height:1.65; }
        .opt-line { display:block; padding:9px 11px; margin:4px 0; border:1px solid transparent; border-radius:4px; color:#c9e1f0; cursor:pointer; transition:.16s ease; }
        .opt-line:hover { color:#fff; background:#084b70; border-color:#137da5; }
        .opt-line.selected { color:#fff; background:linear-gradient(90deg,#09618a,#075074); border-color:#1bc5eb; box-shadow:inset 3px 0 #2be4ff; }
        .opt-line input { appearance:none; width:14px; height:14px; margin:0 9px -2px 0; border:2px solid #658ba4; border-radius:50%; background:#021b32; box-shadow:inset 0 0 0 3px #021b32; }
        .opt-line input:checked { border-color:#2be4ff; background:#2be4ff; box-shadow:inset 0 0 0 3px #073a5a,0 0 8px rgba(43,228,255,.7); }
        .sticky-actions {
            position:sticky; z-index:3; bottom:0; margin:10px -26px -22px;
            padding:12px 26px; display:flex; gap:10px; justify-content:flex-end;
            background:rgba(2,25,48,.96); border-top:1px solid #12658e;
            box-shadow:0 -8px 20px rgba(0,10,30,.22); backdrop-filter:blur(8px);
        }
        .score-hero {
            display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px;
        }
        .result-label { color:#8fb5cd; font-size:13px; }
        .result-summary { line-height:1.9; color:#c8e1f0; font-size:14px; }
        .score-num { font-size:48px; font-weight:700; color:#42e8ff; line-height:1.1; text-shadow:0 0 18px rgba(34,220,255,.35); }
        .level-tag {
            display: inline-block; margin-top: 8px;
            background:rgba(25,190,224,.15); color:#5ceaff; border:1px solid #159bc2;
            padding:4px 12px; border-radius:3px; font-weight:600;
        }
        .feature { color:#a8c8da; font-size:13px; line-height:1.65; margin-top:10px; }
        .weak-item {
            border-top:1px solid #124d6d; padding:12px 0;
        }
        .weak-item:first-child { border-top: 0; }
        .weak-name { font-weight:600; color:#e9f8ff; margin-bottom:5px; }
        .weak-score { color:#8eb4cc; font-size:12px; margin-bottom:6px; }
        .weak-measure { color:#c9e3f2; font-size:13px; line-height:1.6; background:#052f50; border:1px solid #11587c; padding:10px 12px; border-radius:4px; }
        .empty-result { color:#86a9c0; padding:8px 0; }
        .hidden { display: none !important; }
        @media (max-width: 800px) {
            body.pear-container { padding:12px; }
            .card { padding:18px 16px; }
            .sticky-actions { margin:10px -16px -18px; padding:11px 16px; }
            .score-hero { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="pear-container">
<div class="mock-wrap">

    <div class="card" id="panelStart">
        <h2>模拟做题</h2>
        <div class="sub">
            按正式规则从题库抽题：每个三级指标 1 道题，答完即时算个人分并判级。
            <br>仅供联调演示，不写入测评批次 / 班组结果。
        </div>
        <form class="layui-form" onsubmit="return false;">
            <div class="start-row">
                <div class="layui-inline">
                    <select name="version_id" id="versionId" lay-search>
                        {volist name="versions" id="v"}
                        <option value="{$v.id}">{$v.name}{if condition="$v.version_no"}（{$v.version_no}）{/if}</option>
                        {/volist}
                    </select>
                </div>
                <button type="button" class="pear-btn pear-btn-md pear-btn-primary" id="btnStart">开始模拟</button>
            </div>
        </form>
    </div>

    <div class="card hidden" id="panelExam">
        <div class="progress-bar">
            <div>
                <strong id="examTitle">模拟试卷</strong>
                <span id="examMeta" style="margin-left:8px;"></span>
            </div>
            <div>已答 <span id="answeredCnt">0</span> / <span id="totalCnt">0</span></div>
        </div>
        <div id="questionList"></div>
        <div class="sticky-actions">
            <button type="button" class="pear-btn pear-btn-md" id="btnAbort">放弃</button>
            <button type="button" class="pear-btn pear-btn-md pear-btn-primary" id="btnSubmit">交卷并算分</button>
        </div>
    </div>

    <div class="hidden" id="panelResult">
        <div class="card">
            <h2>模拟结果</h2>
            <div class="score-hero" style="margin-top:12px;">
                <div>
                    <div class="result-label">个人得分</div>
                    <div class="score-num" id="resScore">0</div>
                    <div class="result-label" style="margin-top:4px;">满分 <span id="resFull">100</span></div>
                    <div class="level-tag" id="resLevel">—</div>
                    <div class="feature" id="resFeature"></div>
                </div>
                <div>
                    <div class="result-label" style="margin-bottom:8px;">作答概况</div>
                    <div class="result-summary">
                        <div>题数：<span id="resQcnt">0</span></div>
                        <div>已答：<span id="resAnswered">0</span></div>
                        <div>薄弱指标：<span id="resWeakCnt">0</span></div>
                        <div>版本：<span id="resVersion">—</span></div>
                    </div>
                    <div style="margin-top:16px;">
                        <button type="button" class="pear-btn pear-btn-md pear-btn-primary" id="btnAgain">再测一次</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="card">
            <h2 style="font-size:16px;">薄弱指标与赋能建议</h2>
            <div class="sub" style="margin-bottom:4px;">未拿满分的题目，按失分从高到低排列；建议优先取本质安全型建设措施。</div>
            <div id="weakList"></div>
        </div>
    </div>
</div>

<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
<script>
layui.use(['form','jquery','layer'], function(){
    var form = layui.form, $ = layui.jquery, layer = layui.layer;
    form.render('select');

    var state = { token: '', questions: [], answers: {} };

    function show(panel){
        $('#panelStart,#panelExam,#panelResult').addClass('hidden');
        $('#'+panel).removeClass('hidden');
    }

    function refreshProgress(){
        var n = 0;
        state.questions.forEach(function(q){
            if (state.answers[q.question_id]) n++;
        });
        $('#answeredCnt').text(n);
        $('#totalCnt').text(state.questions.length);
        state.questions.forEach(function(q){
            var el = $('#q-'+q.question_id);
            if (state.answers[q.question_id]) el.addClass('done');
            else el.removeClass('done');
        });
    }

    function renderQuestions(list){
        var html = '';
        list.forEach(function(q){
            html += '<div class="q-item" id="q-'+q.question_id+'">';
            html += '<div class="q-meta">第 '+q.seq+' 题</div>';
            html += '<div class="q-ind">'+escapeHtml(q.indicator_name)+'</div>';
            html += '<div class="q-title">'+escapeHtml(q.title)+'</div>';
            (q.options||[]).forEach(function(opt){
                html += '<label class="opt-line">'
                    + '<input type="radio" name="q_'+q.question_id+'" value="'+opt.id+'">'
                    + escapeHtml(opt.content)
                    + '</label>';
            });
            html += '</div>';
        });
        $('#questionList').html(html);
        $('#questionList input[type=radio]').on('change', function(){
            var name = this.name; // q_123
            var qid = parseInt(name.replace('q_',''), 10);
            state.answers[qid] = parseInt(this.value, 10);
            $(this).closest('.q-item').find('.opt-line').removeClass('selected');
            $(this).closest('.opt-line').addClass('selected');
            refreshProgress();
        });
        refreshProgress();
    }

    function escapeHtml(s){
        return String(s==null?'':s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    $('#btnStart').on('click', function(){
        var vid = $('#versionId').val();
        if (!vid) { layer.msg('请选择指标版本'); return; }
        var load = layer.load(2);
        $.post('/TmMockExam/start', {version_id: vid}, function(res){
            layer.close(load);
            if (!(res.success || res.code===0)) { layer.msg(res.msg||'开始失败'); return; }
            state.token = res.data.token;
            state.answers = {};
            $.getJSON('/TmMockExam/paper', {token: state.token}, function(p){
                if (!(p.success || p.code===0)) { layer.msg(p.msg||'加载试卷失败'); return; }
                state.questions = p.data.questions || [];
                $('#examTitle').text(p.data.version_name || '模拟试卷');
                $('#examMeta').text('共 '+state.questions.length+' 题');
                renderQuestions(state.questions);
                show('panelExam');
                window.scrollTo(0,0);
            });
        }, 'json');
    });

    $('#btnAbort').on('click', function(){
        layer.confirm('确认放弃本次模拟？', function(i){
            $.post('/TmMockExam/clear', {}, function(){
                state = { token:'', questions:[], answers:{} };
                show('panelStart');
            }, 'json');
            layer.close(i);
        });
    });

    $('#btnSubmit').on('click', function(){
        var total = state.questions.length;
        var answered = Object.keys(state.answers).length;
        if (answered < total) {
            layer.confirm('还有 '+(total-answered)+' 题未答，未答按 0 分计，确认交卷？', function(i){
                layer.close(i);
                doSubmit();
            });
        } else {
            doSubmit();
        }
    });

    function doSubmit(){
        var load = layer.load(2);
        $.ajax({
            url: '/TmMockExam/submit',
            type: 'POST',
            dataType: 'json',
            data: {
                token: state.token,
                answers: JSON.stringify(state.answers)
            },
            success: function(res){
                layer.close(load);
                if (!(res.success || res.code===0)) { layer.msg(res.msg||'提交失败'); return; }
                renderResult(res.data || {});
                show('panelResult');
                window.scrollTo(0,0);
            },
            error: function(){ layer.close(load); layer.msg('提交失败'); }
        });
    }

    function renderResult(d){
        $('#resScore').text(d.total_score != null ? d.total_score : '—');
        $('#resFull').text(d.full_score != null ? d.full_score : '100');
        $('#resQcnt').text(d.question_cnt || 0);
        $('#resAnswered').text(d.answered_cnt || 0);
        $('#resWeakCnt').text((d.weak_list||[]).length);
        $('#resVersion').text(d.version_name || '—');
        if (d.level) {
            $('#resLevel').text(d.level.level_name || '—');
            $('#resFeature').text(d.level.feature_desc || '');
        } else {
            $('#resLevel').text('未判级');
            $('#resFeature').text('');
        }
        var html = '';
        (d.weak_list || []).forEach(function(w, i){
            html += '<div class="weak-item">'
                + '<div class="weak-name">'+(i+1)+'. '+escapeHtml(w.indicator_name)+'</div>'
                + '<div class="weak-measure">'+escapeHtml(w.measure||'暂无')+'</div>'
                + '</div>';
        });
        if (!html) html = '<div class="empty-result">全部满分，暂无薄弱指标。</div>';
        $('#weakList').html(html);
    }

    $('#btnAgain').on('click', function(){
        state = { token:'', questions:[], answers:{} };
        show('panelStart');
    });
});
</script>
</body>
</html>
